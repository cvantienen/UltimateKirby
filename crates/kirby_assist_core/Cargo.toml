# Standalone host-testable logic crate; intentionally has no Skyline dependency.
# From the project root:
# cargo test --manifest-path crates/kirby_assist_core/Cargo.toml
# cargo run --manifest-path crates/kirby_assist_core/Cargo.toml --example walkthrough
# Add portable policy/helpers here; keep native game calls in the main plugin.
[package]
name = "kirby_assist_core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent assist decision and input arbitration logic; consolidated fighter profiles and related native constants and tests; removed retired slide, Y-combo and disconnected whiff-punish code while preserving active Fair follow-up; removed the retired jab-to-grab shortcut and menu wiring; separated Kirby follow-ups from shared SDI; grouped shared controller, observation and survival code and isolated fighter-specific policies and status tables; extracted Bowser receipt and drift rules, Kirby live follow-ups, fighter interruption and tuning rules, and Falcon Punch observations; separated Ganondorf tech-window selection; extracted Bowser shield-spin tracking; removed retired fixed roll-read prototype; added per-fighter configurable tilt facing; consolidated motion progress helpers into timing and fighter interruption classification into native states; separated Turbo t-bag from ledge assist and removed the obsolete D-pad Turbo sampler; consolidated duck geometry and policy into auto_duck; moved shared Hitbox into autopilot_guard; clarified generic input arbitration behavior; removed hard-coded short-hop and D-pad B-reverse shortcuts while preserving configured recipes; removed temporary one-match probe counters and added ledge trump as an assignable button built-in; removed ledge trump's retired mode, global config key and scenario identity while keeping only the assignable button built-in; moved separate unit test files into the test directory; consolidated related handoff, ledge range and Bowser shield helpers; centralized out-of-shield target range validation; consolidated copied target observations and projectile classification; unified save update handling, choice cycling, and sequence header classification; reorganized the crate into shared, fighters and policies directories and merged small helper modules into their parents while keeping root module paths; consolidated reaction event tracking and editor field lookup without changing behavior; split recipe editor adjustments into focused handlers, consolidated identical fighter status cases, and shared configured out-of-shield grab sampling without changing behavior; refactor and logic audit that splits the menu input, sequence parser, ledge timeline, survival and out-of-shield samplers into focused helpers, moves per-fighter Final Smash and up-special status tables into native_states/kind_statuses.rs, shares one aligned diagnostic configuration table, removes dead code, and fixes ledge-attack visits, trip follow-up facing and diagnostic row alignment; documented core Rust APIs with technical and plain-English rustdoc"
license = "MIT"

# A crate is a Rust compilation unit. This library is imported by the plugin
# through its path dependency; running a core example runs on the host computer.
[lib]
path = "src/lib.rs"

# Fighter reference facts are parsed from the canonical JSON asset.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
diagnostic-logging = []
