[package.metadata.skyline]
titleid = "01006A800016E000" # Smash Ultimate

# Skyline loads a native dynamic library. rlib also supports Rust-side tooling.
[lib]
crate-type = ["cdylib", "rlib"]

# Skyline supplies hooks/native bindings; our local core supplies testable policy.
# A Cargo dependency imports code, not physical controller packets.
[dependencies]
skyline = "0.6.0"
nnsdk = "0.6.2"
imgui-api = { git = "https://github.com/Coolsonickirby/imgui-api", rev = "9259902433138ec9c9ef9e4b152de01403f9456f", optional = true }
kirby_assist_core = { path = "crates/kirby_assist_core" }

# Logging is a compile-time choice, independent of optimized/debug profiles.
# The default build is silent. Add --features diagnostic-logging for testing.
# Features are decided by the compiler and cannot be toggled in config.txt.
# Runtime settings are read from the SD file by LiveConfig::parse instead.
[features]
default = ["imgui-menu"]
diagnostic-logging = ["kirby_assist_core/diagnostic-logging"]
# Temporary one-match file-only aggregate probe; not enabled by normal builds.
silent-probe = ["kirby_assist_core/probe-counters"]
# The battle combo engine is always available; only rendering is optional.
# Disable default features for a headless build without the external ImGui host.
imgui-menu = ["dep:imgui-api"]

[profile.dev]
panic = "abort"

# Release optimization changes compilation, not the tool's runtime settings.
[profile.release]
panic = "abort"
lto = true
