Fixes E0015 in static native State initialization by providing a const GrabHandoff constructor; verifies construction inside a const State fixture without changing runtime delivery behavior.

Keeps facing, reach and predicate waits responsive across short native-observation gaps without replaying missed timed inputs or removing authored waits. Adds input-only run_to_ledge positioning with inward offset, stick strength, arrival tolerance, braking distance and bounded movement time editable in Training. Adds instant opponent-facing/back-facing if/else blocks with precomputed jumps, serialization and editor support; preserves existing ledge-facing snapshot behavior and adds execution, cancellation, braking and save/reload regressions.

Audits Training editor routing, copy/paste, Undo, save validation and Unicode
