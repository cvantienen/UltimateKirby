Fixes automatic reaction sampling to accept the runtime boxed engine directly, retaining lazy allocation and reuse; adds a regression for disabled polling and stable engine storage.
Configures the 74 non-Kirby/Bowser/Yoshi fighter text files against explicit F34/F14/F31 ledge baselines using fighter move intervals, jump squat and documented smash charge points. Adds all seven per-fighter automatic events with immediate character-specific responses and loadout-independent Mii options, preserves generic grab ranges, replaces recovery-only shield backups, and retires 44 weaker generic alternatives to fit the existing parser limits. Documents uncalibrated spacing/resource exceptions; runtime code and protected fighter files are unchanged.
Fixes Training editor saves being silently dropped when gameplay input is unavailable, while preserving Training-only worker authorization. Prevents decorative save formatting from exceeding the file limit for valid compact roster files, and explains modified Y presses. Adds host regressions for all editable slots, all seven automatic recipes, builtins and fighter settings, plus full-roster edit/default/copy/delete/settings persistence on the actual worker stack.
Fixes sequence-authored Up-B out of shield after blocked ledge getup attacks by retaining native guard through the direct Up+B cancel. Applies guard only to delivered grounded-guard output, preserving configured pulse lengths and avoiding cached shield leakage after special startup/takeoff. Adds block/hitstop/duplicate-poll and input-alias regressions; automatic-mode ownership and fighter text files remain unchanged.
Compacts dormant recipe definitions into an indexed library and expands only the selected fighter's live menus and rules, releasing old fighter state on changes and match end. Rejects cross-fighter automatic snapshots, avoids repeated no-roster callback setup and unrelated live-config copies, and defers idle automatic-engine allocation. Copies diagnostic labels safely across menu teardown, corrects Captain Falcon/Jigglypuff reference identities, and adds startup, all-fighter round-trip, zero-idle-allocation and bounded-switch-memory host regressions. Imports the silent Switch's saved whole catalog into backed-up repository fighter/universal sources without writing to the Switch.
Adds explicit fighter-specific Auto-reflect projectile defense, initially configured only for Mr. Game & Watch. Uses read-only native reflectable/absorbable hitboxes and bounded swept prediction, Bucket capacity/readiness checks, confirmed grounded turning and final Down+Special receipt. Integrates exclusive ownership, manual/ledge/master/spectator suspension, bounded cancellation and stable projectile targeting without changing existing punish tapes or native moves. Adds seven saved Fighter settings, a conditional Assist toggle, diagnostic ownership/configuration and core/native-adapter/production-wiring regressions; disabled fighters perform no native projectile queries.
Fixes repeated Bucket defense being suppressed by stale projectile object IDs: the bounded ATTACK-source tracker now publishes coherent object/attack-generation identities, and reflection deduplicates each attack instead of blacklisting a reused object until 32 later attempts. Reuses vacant tracker slots and preserves in-flight ownership, native readiness, full-bucket and duplicate-input safeguards. Adds repeated Samus-style missile/charge-shot, partial-gauge and source-reuse regressions without changing sequence values or adding a cooldown.
Registers Pyra and Mythra independently with editable nonattacking ledge starters, separate saved menus and reference/grab data; tests form swaps and first-save isolation. Raises the section admission bound to 2112 while retaining actual-count allocation and the 512 KiB file limit.


Fences live input publication and delivery to the exact selected-controller update so recent cached packets and late observations cannot replay dashes, grabs or specials into newer input. Clears foreign selected sequences during fighter-profile fallback, with packet-release, production-publication and fighter-isolation host regressions.

Cancels input tapes across shield break, sleep, bury/freeze, command captures, cinematic victims and kind-specific forced/swap states while preserving safety and opponent stun punishability. Replaces numeric Up-B continuation guesses with pinned per-fighter states and stops drift on unrelated moves. Validates the current human actor separately from an Ice Climber partner, includes both climbers in a bounded sixteen-actor observation roster, bounds nearest reaction candidates, handles ambiguous same-entry attribution, and excludes attached Pikmin/Luma from projectile reflection. Adds production native-adapter and rare-state regression coverage without changing sequence files.
Retains consumed roll and grab-defense identities for all sixteen possible paired actors so nearest-candidate changes cannot replay an already handled event.

Stops automatic grab runaways: close idle grabs send Grab directly, far idle dash startup is shared across fighters and bounded even without receipts, failed approaches require new intent or a confirmed enemy-shield end, and grab delivery releases forced horizontal input after its first packet. Manual retreat hands back control while preserving inert grab receipts. Resets OOS state on native fighter-kind changes, derives default grab ranges from that fighter's references and saved reach instead of Bowser constants, skips unused fallback lookups, and rejects stale pivot overrides after physical input changes.
Protects routed manual jumps and released jump buffers from grounded automatic grabs/specials during delayed native feedback. Bowser tracking ownership now requires delivered or confirmed Up-B input; automatic tapes abandon pending Grab/Up-B steps on jump startup/takeoff while manual tapes stay literal. Shared grab receipts use native progress in live play, limit unacknowledged R delivery, and allow pure manual jump handoff without leaking competing specials. Adds stalled-feedback and actual live-guard regression coverage.

Isolates ledge/button playback from earlier automatic grab reservations, preserves literal shield holds through grab handoff, and reconciles raw cancellation with fresh native OOS readiness without an extra observation. Routes old chase-first automatic grab tapes through native grab positioning, revalidates undelivered custom grabs on shield/target changes, and expires static-shield receipts from already observed opponent progress. Adds ledge-shield isolation and instant-grab regressions.

Preserves selected directional and single-frame Attack inputs plus literal Special/Grab/Shield packets after native mapping, clears stale shield/Catch aliases on authored release frames, and keeps Up-Smash/jump shield cancels distinct from Up-Tilt shield drop. Passive ledge shield tails use existing copied opponent clocks when the guard pose is static and release stale tails without a usable clock; authored shields and shieldstun/hitstop retain their own rules. Adds smash delivery, static-guard release and live packet-wiring regressions.



Centralizes exclusive sequence input ownership, protects committed automation from manual and competing requests, coordinates native safety inputs, and releases all controls and pending plans on completion or cancellation. Adds cross-feature controller and live arbitration regressions.


Adds stage-aware survival DI with native blast-zone queries and stable launch-release inputs; uses native tech windows and lockout, surface eligibility and frame-segment collision forecasts; spaces SDI flicks on native hitstop with real stick rearming and blast-zone-aware directions. Enforces one exclusive safety phase with clean DI, tech, SDI and mash handoffs and adds host regressions; no native physics/status writes, documentation changes, mod build or upload.


Improves roster-wide Auto Tech with read-only native floor/wall/ceiling contacts, animated ECB base offsets and current-scale forecasts, including frozen poses and the final victim-hitlag frame. Synchronizes shield releases and bounded delivery receipts with native Guard consumption, prioritizes imminent/committed tech edges ahead of DI without mixing modes, and cancels stale receipts while preserving lockout. Adds roster/contact/delivery/ownership host regressions; no documentation changes, native physics/status writes, mod build or upload.

Clarifies the native FFI ray safety contract, names ABI parameters descriptively, and verifies native data layouts at compile time. Adds regression coverage that fighter grab timings and reach come from the matching shared fighter reference, never a universal fallback. Removes the unused universal roll-distance field repeated across 79 fighter timing profiles.

Normalizes formatting across maintained Rust modules while keeping generated opponent reference data excluded from manual formatting.

Canonicalizes generated split-sequence bundles to one final newline while retaining section separation.

Centralizes roster-wide fighter stats and move-frame facts in data/Ultimate_stats.json, keyed by native kind and shared across player/opponent roles; removes duplicate per-fighter timing mirrors and external fallback paths, and refreshes fighter-reference documentation.

Splits embedded fighter-data parsing into validated fighter and move steps, and groups recovery checks by eligibility, native state, and frame validity.

Extracts recipe preset matching into named helpers and refreshes the source map and maintenance guidance to match current code and validation commands.
Separates sequence catalog parsing from the fixed-size recipe data model.
Supports Python 3.9+ build tools with a TOML reader backport.
Uses silent-build-safe diagnostic bindings and counts deferred menu lock retries.
Names shared shield, dodge, grab, and capture status IDs for clearer native-state checks.
Moves shared gameplay observations and controller requests into a neutral module and names shared assist button ownership without ledge-specific labels.
Names shared native fighter kinds and generic status IDs so gameplay checks no longer rely on unexplained literals.
Names fighter-specific native statuses, transition terms, work IDs, weapon kinds, and battle-object categories from the pinned SDK table.
Refactors finisher validation, hit confirmation, native-status checks, and input selection into named helpers without changing behavior.
Renames the shared settings menu and grounded posture helper to reflect their use across multiple features.
Names ledge positioning eligibility and movement phases, sequence frame validation, grab edges, and tech clocks to clarify compound decisions.
Separates roster-refresh prerequisites from active observation consumers for easier review.
Names tuning indexes, controller inputs, native work IDs, motion/parameter hashes, and ABI offsets to clarify Rust numeric literals.
Splits recipe-editor adjustment and saved-input serialization into focused helpers, and repairs test fixtures without changing controller inputs.
Moves shared assistance settings and fighter grab data out of ledge-specific naming and modules.
Fixes native tech surface eligibility, shared aerial-status lookup, and stale host test harnesses.

Restructures project documentation around current user workflows and the Rust runtime architecture, with developer extension and validation guidance.

Fixes live fighter settings resolution to populate the renamed assist configuration field.

Fixes diagnostic calibration imports to resolve controller constants from the core crate in both plugin and host tests.

Extracts Training passthrough and resume handling and centralizes native controller-pointer reads without changing input or timing behavior.

Neutralizes the stick during unshielded automatic Grab delivery while retaining approach, manual turn-away cancellation and existing Grab timing.

Removes reported silent and diagnostic build warnings by gating diagnostic-only and test-only constants and removing an unused import.

Adds diagnostic-only Grab edge comparisons before and after the mapper to investigate automatic Grab versus manual controller input.

Extends diagnostic Grab comparisons to bounded held-input samples following each press.

Aligns mapped unshielded automatic Grab with the Catch and Guard combination observed during manual Grab, without adding a raw Shield press.
