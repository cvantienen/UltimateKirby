Keeps automatic grab/dodge/punish searches suspended throughout toggled ledge
mode, including manual pauses. Improves defensive-only ledge shield coverage for
getup attacks, nearby recovering Up-Bs, multihit gaps and bounded weapon/item
hitboxes. Preserves authored ledge tapes and tech safety priority. Adds native
floor-tech eligibility and remaining-hitstun cooldown progress for frozen damage
poses, with host detector, delivery and cross-mode regressions. No native move
or physics changes, documentation edits, mod build or Switch upload.

Keeps automatic Bowser Up-B chase active through ordinary movement-stick changes
and shield release, while retaining fresh action/C-stick handback and safety
cancellation. Confirmed spin tracking may follow its locked opponent at the
ledge without permitting new ledge grabs/punishes; preserves configured 69-frame
drift, input pulses and other fighters' controls. Adds cross-owner chase,
range-independent tracking, timeout and interruption regressions.

Requires fighter/event-specific automatic punish recipes, removes generic
shield Up-B and cross-event grab-dodge fallbacks, and leaves new non-grab editor
drafts inert. Removes 76 generated non-Bowser Up-B backup templates while
preserving generic grabs and their per-fighter ranges. Tags live rule access
with fighter/revision identity; delivers one grab-dodge packet with bounded
neutral confirmation and rejected-packet budgets. Adds Yoshi/Lucina, fighter
switching, explicit configuration and single-dodge regressions; no version bump,
mod build or Switch upload.



Keeps committed automatic Bowser Up-B startup and configured drift through physical button, stick and menu-toggle input across roll/dodge reads, grab-dodge follow-ups and shield backup. Ledge-trap L, native move end, target loss and safety retain cancellation; other fighters and new-reaction admission keep their existing manual controls. Adds cross-owner tracking and ownership regressions.


Starts the lightweight match menu visible and removes its control hints while preserving Training editor hints and Minus/L navigation controls. Splits all 77 fighter configurations into named source files, assembles and validates the combined Switch catalog during build/upload, and supports backed-up split-source imports. Adds inert universal named templates to the Training copy picker with destination conditions, activation, Undo and save preservation; retains all existing fighter recipe values.


Fixes Bowser automatic Up-B tracking loss across shield hitstop/readiness changes and delayed native startup. Verified mapped Special+Up now retains a bounded, input-free receipt and exclusive punish priority; late native confirmation resumes after the delivered B with the full configured drift duration. Rejects failed mapper receipts, never retries B, and preserves L, target loss, capture/damage, airborne-start and 24-update expiry safeguards across shield backup, roll/dodge reads and grab-dodge follow-ups. Adds receipt handoff, priority, duration and cancellation regressions without changing sequence values.


Fixes reused lightweight menus starting hidden at battle entry and retaining stale page content. Applies scene-aware visibility defaults, removes lightweight character/page headings and control legends entirely, and preserves Training titles/hints and Minus/L+D-pad controls. Prevents Training save waits and stale cached cards from leaking into match selectors; permits allocation-free cursor refreshes while replacement is gated. Extracts the production snapshot builder and row renderer for host tests of actual displayed text, ImGui stack balance, rematches, cache invalidation and Training isolation without sequence changes.


Restores the lightweight menu publisher's generation snapshot, nonblocking cached-view lock and save gate after extraction; gates its diagnostic-only SavedChoice import. Compiles and tests the exact production publication function in both host logging configurations to catch missing bindings without changing menu behavior or sequences.

Fixes Training sequence saves retaining stale startup baselines after the first edit, refreshes runtime caches on verified completion and preserves newer drafts using payload identity. Retains the first explicit save through cached-menu refreshes without blocking input. Releases clean editor records and tool buffers on leaving Training, drains orphaned save completions and reuses unchanged lightweight button-role mappings; adds save/reopen, late-result, worker-gate and idle-poll regressions.

Adds opt-in --replace-sequences --smash-closed to single/both-Switch release uploads, backing up and verifying active sequences.txt through the existing uploader before replacement. Assembles current universal and fighter sources at upload time, preserves staged uploads by default and read-only preview/verification modes, and adds routing, split-source, backup-failure and active-file replacement tests.

Gates mapper feature work on fresh revalidated selected-controller fighter ownership before menus, analysis, overlays or profiling; clears local participation on lost routes without changing the master preference. Master OFF now fully resets plugin session/routes, pending inputs, tracking and Training handoffs with monotonic observation fences. Gates projectile capture, draw profiling and periodic diagnostic reports while inactive, retains native input passthrough and the existing local re-enable gesture, and adds production teardown/route/startup/reconnect regressions without new scene hooks, services or native gameplay writes.

Audits cross-fighter automatic punishes: separates ordinary configured response readiness from direct Up-B, fixes independent grab/backup/grab-dodge movement observations, and preserves native Up-B checks and Bowser tracking. Caches per-event observation requirements, skips unnecessary Up-B queries and grab-only roll-engine construction, reuses enabled engines in place and adds all-77-fighter readiness, range, cancellation and no-placeholder-input regressions without retuning fighter files or adding waits.

Adds a complete current sequence-text quick reference with searchable printable offline HTML: action aliases, durations, grab/range distinctions, movement and facing checks, current versus legacy reactions, templates, builtins and fighter/universal setting keys. Links it in maintained docs, extends the existing cheat-sheet generator and checks every copyable example plus parser-token coverage and all 48 fighter-setting bounds using host-only regressions.
Adds Mr. Game & Watch Up-B automatic punish recipes for rolls, spot dodges, air dodges and dodged grabs, preserving his existing grab and shield-backup configuration.
