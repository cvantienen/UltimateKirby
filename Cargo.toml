# Main package: a Skyline plugin compiled for the Switch, not a desktop binary.
# Build with cargo skyline build --release from this directory.
# The nested core is a separate crate; use --manifest-path to test it on the host.
[package]
name = "kirby_assist"
# Required by the source syntax, dependency imports, and array iteration rules.
edition = "2021"
# Single release-version source: logger and release builder read this value.
version = "2.7.8"
description = """ menu update for preformance; simplified
chatgpt fixes
Allows leading Wait actions to hold a true neutral standstill before any supported recipe, including short_hop_nair, instead of rejecting Wait plus paired Nair. Adds paired short_hop_fair/bair/uair/dair actions that send Jump+Attack+direction together, with one jump pulse and native acceptance/retries. Preserves the explicit after-hop Nair Attack delay and separate C-stick aerial path. Uses bounded native-progress pause clocks with hitstop/duplicate protection and idle-loop handling, cleared on plan reset; no new rays, scans or file reads in play.

Adds the startup action short_hop_nair as an explicit immediate neutral X+A short-hop Nair recipe and a separate Yoshi Neutral option, preserving existing wait-based Nair recipes. File directional Fair/Bair/Uair/Dair now opt into C-stick aerial selection only after native takeoff, with analog axes and digital flick edges released on acceptance; compiled recipes retain their prior inputs. Reuses the shared right-stick overlay, preserves paired jumps/Brother mapping, and adds parser plus native-progress regressions.

Adds explicit toward-opponent and away-rom-opponent file directions, retaining opponent as the toward alias and nonnegative drift strengths. Away resolves independently of facing through the same native-confirmed drift engine without extra opponent scans; overlapping horizontal positions yield neutral away input. Adds a quick-start explanation and full supported action/direction key at the top of deployment sequences.txt.

Changes auto-mash startup to OFF in the Rust fallback and supplied deployment configuration, retaining the in-game Auto-mash toggle for opt-in use. Updates the release helper summary and maintained control notes accordingly.

Groups core policy and Switch integration module declarations by responsibility while preserving existing public module paths and runtime behavior.

Hardens the runtime master switch with an independent native match/intro lock that stays active during OFF passthrough, rather than relying on the expiring menu observation lease. Requires a 350ms Plus+Minus hold and 150ms complete release; rejects held chords crossing match boundaries and missing-controller samples. OFF clears pending overlays/requests and rejects in-flight observation publication; mapper rechecks passthrough before applying outputs. ON restores saved feature selections after cleanup. Adds portable gesture regressions; only minimal read-only battle/toggle checks remain while OFF.

Adds tools/upload_sequences.py to send only deployment/ultimate/kirby_assist/sequences.txt to both saved Switch IPs using anonymous FTP port 5000, attempting both targets independently and verifying each by SHA-256 read-back. Includes dry-run preview and fake-FTP tests; never builds or uploads NROs.

Reverts the recent stale-selection/cache changes at the user's request after the reported replay was identified as a different getup option. Restores prior recipe inheritance, observation publication and menu-change reset behavior; keeps silent test-option filtering and larger, more widely spaced menu text.

Removes inactive ledge-policy compatibility fields and no-op methods while continuing to accept and validate legacy settings. Keeps grab reach centralized in fighter profiles, updates the architecture map/config guidance, and removes retired numeric settings from the bundled defaults.

Hardens menu option changes against stale recipe publication: clears pending output/evaluation state, rejects observations from an older settings epoch and removes inherited file overrides before resolving selected IDs. Filters file choice IDs starting with test and labels containing [TEST] from silent startup catalogs only. Enlarges the top-menu font and gaps, keeping the selected setting in view with hidden horizontal scrolling when needed.

Restores the previous sequences.txt layout at the user's request, undoing the all-character heading reorganization while preserving every existing recipe, timing edit and dynamic file-option feature.

Organizes sequences.txt with clear alphabetical headings for all 77 registered fighter profiles and five getup-situation subsections per fighter, preserving the ten active Kirby input tests. Explicitly labels empty sections and the remaining compiled-recipe fallback so the file cannot be mistaken for a completed all-roster timing migration.

Moves all ten Kirby Neutral [TEST] choices from compiled menu handlers into enabled, named sequences.txt sections, preserving test labels and recipe values without changing the default selection. Removes the redundant Rust training fixture module; adds narrowly validated grounded Kirby Down Special/Stone support to the existing file executor so the special-input test also lives in text. Tests validate the supplied file and native short-hop/special delivery behavior.

Extends startup sequences.txt to append bounded named ledge-menu choices and rename/override existing choices, keeping compiled options and defaults in place. Accepts optional name/label, readable Smash action names, short-hop/wait phrases, percentages and labeled motion-frame limits. Freezes augmented menus at startup; gameplay retains fixed recipes and existing native-confirmed executors without new file reads or parsing. Validates normalized duplicate IDs, labels, section/property caps, move data and 32-option list limits before installing hooks.

Restores retired Spot punish, Grab dodge/punish and ledge trump only as diagnostic menu toggles, all initially OFF, and adds an opt-in Perf gauge. Samples 1/16 accepted local observations with fixed timing/ray counters; the existing writer formats ranked five-second reports and a cached compact card. Silent builds exclude instrumentation. Adds session generations and idle expiry for gauges, clears pending tech and grab targets on mode changes, skips airborne grounded-reader scans and idle combo velocity reads, and throttles failed trump edge searches to 30 mapper ticks.

Restores auto-tech as a per-fighter ON/OFF menu row, initially OFF with the supplied configuration. Menu state controls both prediction and tech requests; OFF bypasses collision queries entirely. Eligible ON predictions stop after minimum one-frame contact is found because remaining rays cannot improve that result. Adds readable diagnostic configuration for the toggle; other retired reaction/trump features stay disabled.

Fixes menu D-pad navigation leaking into the B-reverse shortcut by blocking shortcut delivery whenever menu directions are consumed and masking consumed D-pad buttons before edge sampling. Swaps menu navigation to Left/Right for lists and Up/Down for options. Hidden D-pad B-reverse now supplies an opposite-direction priming flick before neutral B and the selected-direction reversal, so the physical analog stick need not supply the setup.

Temporarily disables auto-tech, spot-dodge punish, automatic grab detection/dodge/punish and auto ledge trump even with older enabled SD settings. Hides the two retired reaction menu rows and bypasses tech collision prediction, grab-target observation and trump edge searches. Keeps regular roll reads, ledge-trap responses, mash and other helpers available.

Makes the separate Kirby automatic Fair-hit Fsmash helper first-hit-only through landing: any later connecting Fair hit cancels the queued smash, including contact observed during hitstop. Native hit observation now covers later Fair frames so cancellation can be detected.

Replaces the previous Kirby combo launch-floor probes with a fixed 16-native-frame airborne descent ownership budget for all button starters. The automatic Fair-hit follow-up also hands control back after 16 airborne native frames from confirmation. Hitstop and duplicate polls do not spend the budget; landing within it retains normal smash follow-ups. Removes combo floor rays entirely.

Adds an offstage safety gate to Kirby's Fair 1 > Fsmash button starter. Only while a grounded Fair starter is being considered, two short read-only floor probes check the facing/launch lane with velocity-scaled lookahead; an unsafe ledge prevents the automated hop, Fair and fast-fall sequence from starting, while established onstage sequences and other finishers remain unchanged.

Stops the runtime master label from lingering across every non-battle screen: the lightweight selector path has no dependable character-select-only scene signal, so `Kirby Assist: ON/OFF` now appears only as a 1.8-second confirmation after Plus+Minus. Improves the in-battle top-line menu with moderately stronger translucent backing, slightly larger minimum text and wider spacing while preserving its single-line, borderless layout.

Fixes the Arena and character-select runtime master switch by polling Plus+Minus from the configured controller through the installed ImGui callback instead of relying on the battle-only mapper path. A tiny persistent `Kirby Assist: ON/OFF` label now shows the current state outside active battles. The check is edge-debounced and limited to one controller; this supersedes the earlier mapper-only and temporary-toast behavior.

Adds a subtle 38%-opacity near-black strip behind the horizontal top-edge controls, improving readability and eye comfort over bright stages while retaining the borderless, single-line layout and unchanged cached rendering path.

Changes the saved-options menu from a left-side column to one transparent horizontal line pinned to the absolute top screen edge. Cached compact labels and option names are separated across the line, the selected token uses brackets/accent color, and font sizing adapts to available width without per-frame string construction. Diagnostic result cards remain in their existing left-side area below the top line.

Adds a discreet character-select/results confirmation for the runtime master switch: a tiny translucent `KA ON` or `KA OFF` label appears at the top-left for 1.8 seconds after Plus+Minus toggles. It reuses the installed ImGui draw callback, performs no native scene queries or formatting in the render loop, and remains absent at all other times.

Adds an in-game runtime master switch: press Plus+Minus together outside an active battle (including Arena character select/results) to toggle every mod feature. OFF cancels pending ownership, hides/clears overlays and bypasses fighter observation plus all controller rewriting; only the selected-controller chord check remains so the mod can be re-enabled without restarting. The chord is edge-debounced, blocked during ready-go gameplay, consumed on the toggle screen, and preserved by the Brother layout.

Fixes Kirby ledge-trap Nair being interpreted as Fair: all delayed/retried Nair Attack inputs now use a neutral stick, and configured horizontal drift begins only after native ATTACK_AIR confirms the Neutral-Air motion. The same shared ordering protects neutral-getup and jump-getup Nair under delayed online delivery; focused Kirby/Yoshi Nair regressions cover launch, retries and post-acceptance drift.

Menu now starts hidden and toggles on a fresh Minus press in normal and diagnostic Training play; R3 remains available except for the classic monitor chord. Brother controls retain A attack, L special, R/ZR jump, ZL shield, X grab and L3 ledge assist through canonical request translation. File-driven directional aerials now continue after takeoff so Kirby short-hop Fair selects forward+A instead of ending at the jump, with focused regressions for both layouts.

Adds startup-loaded `sequences.txt` fighter sections that override existing
ledge-menu choice recipes without recompilation. Parsing is capped at 256 KiB
and 16 actions per recipe, validates fighter/situation/choice IDs, and copies
fixed recipes into normal native-confirmed Nair, OneShot and grab execution.
Missing sections retain compiled behavior; no SD reads/parsing occur in play.

Centralizes verified native fighter statuses, transition terms, work IDs, fighter and weapon kinds, and object categories; replaces audited raw IDs throughout Rust logic and regression fixtures without changing behavior.

Fixes intermittent ordinary-grab spot-dodge misses: use each opponent's
compiled standing/dash/pivot grab timing and reach (including DLC data), accept
any grounded state with native dodge readiness, and preserve an unaccepted
attempt when higher-priority ownership temporarily suppresses it. The forecast
window is six advancing native frames; no command-grab model or device guarantee.

Hardens recent movement controls for online sampling: held X is a single native
update tap even before delayed jump-squat feedback, while dash pivot/walk state
advances only from fresh fighter observations and not extra mapper polls.

Adds low-priority dash-walk correction: ease the stick after a full dash and it
holds maximum non-dash walk strength; keeping full input still permits running.

Locks held physical X to one short-hop tap: X releases on native jump squat,
remains quarantined through the jump and landing, and rearms only after release.

Adds a low-priority dash-pivot correction for deliberate full-stick reversals.
It holds the reverse for two native game updates, ignores repeated mapper polls,
and yields to every combat, ledge, read, safety, combo, and shortcut owner.

Correcction online timings for the roll,spot,grab,downsmash,etc. 
the past few auto read features wokred good in training mode, but online 

multiple more modes,


Fixes Kirby/Yoshi roll-grab walk/brake stuttering exposed by diagnostic logs.
Their approach may extend inward from observed roll travel; shared roll grabs
check predicted reach/facing and protection on the same native active frame.
Reuses existing observations; down-smash movement is unchanged. Source only,
not built or Switch-validated.

Adds diagnostic-only bounded roll-grab traces: approach/timing gates, raw-to-mapped
Grab delivery, native startup, capture/miss and cancellation evidence. Fixed-size
checkpoints are formatted by the background logger; general ledge snapshots are
rate-limited. No gameplay timing changes; not built or Switch-performance-validated.

Removes learned per-action input-delay compensation and runtime sampling.
Live observations use zero extra compensation; configured move timings and
native action acceptance checks remain in use. Not built or device-validated.


Restores the 1.4.6 source baseline before Yoshi-only calibration. Jump-getup
nair immediately pairs neutral jump+A for a short hop and applies full horizontal
stick toward the opponent after native nair acceptance. Neutral-getup nair uses
a 15-frame hitbox lead. Roll down-smash stands two world units closer to the
ledge than the configured coverage point. Yoshi's roll tongue grab now uses its
own fixed spot 18 world units inward from the ledge (one-unit tolerance), with
active duration centered on vulnerable recovery and no opponent-root tracking.
Other fighters and shared grab helpers retain the 1.4.6 implementation. No new build/device validation is claimed.

Roll grabs brake before arrival, keep any usable position inside grab reach,
and use walking corrections toward the nearest side after overshoot instead
of reverse-dashing across the target. The first active grab frame aims up to
three frames inside the vulnerable recovery window, with a midpoint target
for narrow windows. Applies to shared fighter roll grabs, including Kirby/Yoshi.



Y's automatic B-reverse captures opposite fighter facing on activation,
regardless of physical stick direction, and supplies the reverse flick itself.

Fixes grab requests being disabled by approach animation loops or a shared
movement/turn budget. Native catch readiness permits the request independently
of movement readiness. Dedicated bounded delivery holds R until acceptance,
then uses clean release/retry edges without a special-move retry timer.

Fixes Y being removed before B-reverse readiness checks. R3 restores the old
crouch/walk-cancel turbo with one native update per phase and slight forward
creep; older phase settings no longer slow its dedicated binding.

Roll grabs approach from the nearest side, keep an already usable standing
spot, account for stopping distance and retain the grab input until native
acceptance or a bounded delivery window. Stance preparation cannot override rolls.
R3 alone uses fast crouch/walk-cancel teabag; X requests paired X+ZL short hop; held L3 selects Kirby down-tilt recovery cover; Y attempts neutral-B
reverse instead of 2-frame. L+R3 still toggles the menu; Minus toggles mash.
Restores one-module-per-fighter source layout and fighter-specific grab reach.

Completes the non-DLC compiled roster, including echoes, Pokemon forms and Miis.
Adds fighter-specific move windows, named responses and selectable defaults,
with reference movement statistics documented per fighter. Existing profiles
remain intact. New stationary aerials use neutral drift/native hop forecasts.
Adds front-only roll-smash facing and a body down-tilt roll alternative; treats
projectile travel and resource/custom-native-state requirements explicitly.
Dark Samus shares verified Samus recipes; Meta Knight/shoto/pellet exceptions
avoid ambiguous generic inputs. Bayonetta fair recognizes its custom native state.
No combo playback, runtime fighter JSON, new roster/weapon scans or networking.
These source-checked attempts still need device calibration and build validation;
frame-perfect contact, universal optimality and measured performance aren't claimed.

L+R3 now shows/hides the menu. Minus toggles auto-mash, with cached ON/OFF
status displayed below the five response lists. Mash starts from startup config
and its toggle survives stock/fighter/match changes; disabling immediately releases
cached mash takeover without disabling tech. L remains the autopilot trigger.

Expands Samus with stationary homing/Super Missile coverage for Neutral, Jump,
Roll and Drop; adds flame fair/up-air alternatives and neutral cannon f-smash.
Missiles reuse bounded native input delivery, with a neutral primer, directional B,
startup release and manual handback. Existing defaults and indices are preserved.
Ranged labels explicitly flag projectile travel; no simulated arrival guarantees,
weapon/roster scans, networking or new per-frame observation paths are added.

Expands Yoshi's compiled ledge menu: neutral up-tilt/headbutt f-smash, jump
up-air/fair, roll tongue grab, shield up-air, and risky drop fair/dair chases.
Keeps existing defaults and indices, reuses paired aerial input/native acceptance,
and adds spacing hints for drop fair. No new scans, services or runtime parsing.

Adds cached, fighter-specific qualitative spacing hints beside punish names.
Grabs, passive shield and automatic roll approaches omit range estimates.
Labels describe approximate coverage, not measured maximum contact distances;
this display change adds no gameplay observations or attack timing changes.

Removed live combo playback, fighter combo libraries, combo configuration fields,
combo target acquisition, C-stick playback overlays, and the Combo/Mode menu rows.
L remains held ledge autopilot. Y is now always held 2-frame coverage. Automatic
mash starts enabled in the supplied configuration and Minus toggles it. Existing
tech, SDI, L3 creep, hidden side-D-pad slides and Down ledge trump are retained.
L+R3 opens/closes the menu; visible D-pad edits the five saved response lists:
Neutral, Jump, Roll, Attack and Drop. Hidden Up retains ordinary input.

Adds Sonic, King K. Rool, Isabelle, Pac-Man and Little Mac as part of the original
15 compiled profiles, now retained within the complete base-game roster.
Keeps existing profiles, including Samus roll grab,
immediate drop Bomb, and selectable zair responses. Sonic offers nair/tilts for
Neutral, nair for Jump, down-smash/grab for Roll, shield-nair/grab for Attack,
and shield/down-tilt-then-shield for Drop. Uses Sonic native move windows; no
combos or new observation loops. Fighter JSON is not loaded.
King K. Rool and Isabelle add 4 Neutral, 3 Jump, 2 Roll, 3 Attack and 4 Drop
choices each. Defaults prioritize lingering nair, shield-to-nair, safe drop shield,
and roll grab for K. Rool / down-smash for Isabelle. Extra single-move variants
include up-air/fair, K. Rool belly flop/spike, Isabelle party popper/slingshot/turnip.
Jump+A stay paired through squat/airborne delivery; exact native aerial motion
confirms acceptance. Smashes use a neutral flick primer and release on startup.
Single-move variants are bounded by native progress and hand back afterward.
Published active windows are not extended; projectile travel and spacing remain
limitations. No guaranteed frame-perfect contact or optimal matchup is claimed.
Pac-Man adds nair/tilts/ghost f-smash, aerial jump coverage, long roll grab or
lingering down-smash ghosts, shield-nair/grab/trampoline, and grounded drop
coverage or short-hop fair. His grab has 22 native active frames; the lingering
roll ghost choice covers a bounded 13-frame span inside its real active window.
Little Mac defaults to grounded up tilt for Neutral/Jump, roll down-smash,
shield-up-B, and drop shield. Alternatives include fast tilts, armored f-smash,
a separately timed down-angled smash, grab, low sweep and explicitly labeled
weak-aerial jokes. No default offstage hop, blind KO Punch or charge logic.
Both reuse existing single-move delivery/acceptance paths with no new scans.
Aerial execution is now declared in each fighter profile, separately from move
frame data. Kirby keeps its original explicit short-hop plan. Other profiles use
native-physics adaptive jump coverage: prefer a feasible short hop, otherwise a
full hop. Little Mac's default grounded up-tilt remains grounded. Normal and
shield nairs stay explicitly short unless a profile changes their policy.
Full hops hold X through squat and buffer A only after observed takeoff; their
forecast includes the extra input-delivery leg. Extra single-move jump aerials
use the same profile policy. Missing native parameters retain a documented short
fallback; unknown launch/coverage waits rather than inventing a jump speed.
Native full-hop speed is queried only during active ledge observation. Adaptive
height forecasts use constant-cost gravity integration within bounded windows.
These are approximate reach/trajectory forecasts, not measured hitbox geometry.
Range envelopes, drift and universal optimal contact still require device tuning.
Response settings are cached until a fighter or saved choice changes; GUI strings
are cached until a row/choice/visibility revision. The compact bottom-left UI
still uses the existing imgui-smash host and persists through stock loss.

Full ledge/movement observations and ground-support rays now run only while
ledge/2-frame, slide, or trump needs them, rather than whenever tools are enabled.
In-flight slide/trump attempts continue after trigger release; idle history is
cleared without native observations. No active tool frame cadence was throttled.
No new network/service calls, dependencies, gameplay-state writes or timing hooks.

Source changes only: no build, upload or Rust tests executed for this revision.
Formatting and static source checks do not establish runtime performance or
online reliability. The installed 1.3.4 build is unchanged by these source edits;
heat reduction and Switch frame-time impact require device measurement.


Documentation update: refreshes current controls, timing, diagnostics and build
instructions, with a single Fighters overview in the sidebar. Adds individual
source-based pages for all 77 registered fighter identities, including five
saved response lists, defaults, move windows and grab data. Adds a documentation
refresh/check helper and preserves authored execution notes. Records ongoing
docs maintenance and append-only Cargo description summaries. No gameplay
changes, version bump, mod build or upload; documentation validation only.


Menu readability update: shortens display-only move names while preserving
qualitative spacing hints, action IDs, choice order and gameplay timing. Narrows
the panel from 410 to 360 reference pixels, raises text from 17 to 19 and adds a
small offset pass for heavier text. Labels remain cached; long options wrap.
Updates menu/control guides and all individual fighter references from the
compact-label aliases. Docs checks only; no mod build, upload or Switch visual
validation performed.


Diagnostic-only frozen calibration cards now cover Neutral, Jump, Roll, Attack and Drop responses. Completed cards show available configured move windows, hop/lead/drift, input mapping and native startup evidence, protection timing, root spacing and wait gates; full details use the existing background status.log writer. Fixed-size observation storage and cached rendering add no native queries or gameplay timing changes. Silent builds exclude the feature. Cards hide with L+R3 and clear outside battle/on fighter change. Added source fixtures and calibration documentation; mod compilation and Switch validation remain pending.


Yoshi Neutral get-up nair now forces short-hop selection and pairs X+ZL+A, releasing Jump during squat. Its early lead is centered at 8 frames before protection expiry; fast fall is allowed only during accepted, descending nair at animation frame 15 or later. Brief horizontal nudge is retained. Diagnostic result cards/logs expose the configured fast-fall threshold. Other nair recipes are unchanged. Updated fighter/calibration guides and added source fixtures; no mod build, upload or on-device validation performed.


Added Yoshi Neutral Bair (hit 2) as an appended saved choice: turn away on recognition, confirm native facing, then paired X+ZL short hop with directional A buffered during jump squat. Targets bair second hit at frame 14 against predicted protection expiry, with a separate configurable early lead (default zero), no C-stick tilt-cancel, drift or fast fall. Discrete hit windows 11, 14, 18–19 are recorded separately; diagnostic metadata targets only hit 2. Updated fighter/sequence guides and added source fixtures. No mod build, upload or Switch validation performed.


README reference update: adds the current control table and copyable commands for
documentation setup/validation, fighter-page generation, host checks, packaged
silent/diagnostic builds, FTP dry-run/upload/verification, diagnostic logs and
the release checklist. Documentation only; no mod build or upload performed.

The README backlog is now placed near the top and split into character-specific
calibration/fix tasks and system-level compatibility, performance and timing work.

Training Modpack coexistence: defers mapper-hook installation until fighter
callbacks so Training can resolve FIM during startup; recognizes original or
known Skyline-patched mapper entries with unique-match validation. Chains the
existing mapper hook. With the standard Training Modpack NRO installed, Training
Mode requires held L for assists and passes menu/save/load/recording chords
through unchanged. Outside Training Mode controls are unchanged. Adds resolver
regression checks and documents the explicit recording/playback handoff.
Diagnostic build requested for Switch validation; no live latency compensation.

Adds held-L grounded defensive shielding against nearby currently active fighter
attacks, including opponents without a ledge grab. Uses existing roster IDs,
validated native attack-active flags and a two-frame swept root-position warning
envelope (not exact hitbox collision or projectile tracking). Native guard
availability, committed response/manual handback and higher-priority tools gate
the request; shield hitstop retains guard and clearing danger returns control.
Adds default-on autopilot_shield startup setting, geometric/config fixtures and
control/implementation documentation. Source-only while the compatibility build
is being tested; no new Switch build or upload for this feature.

Fixes Training passthrough starving the menu's release-to-arm tracking: physical
release samples are now observed without consuming input, editing the menu or
running tools, and retained through first profile selection/session resets.
Adds focused regression tests for L rearming and avoiding phantom menu taps.
Prepares a corrected diagnostic test build; Switch confirmation remains needed.

Kirby Neutral nair adds a fighter-specific walk during the existing pre-launch
wait: 0.65 fast-walk input toward the remembered ledge anchor, aiming six world
units inside the edge with native braking and ground-support checks. Existing
nair timing, paired delivery, drift and other fighter/choice handlers are
unchanged; arrival never delays the launch gate. Adds focused host regressions
and documents the custom handler/shared-helper structure and tuning constants.
Source only; no Switch build, upload or on-device spacing validation.

Replaces the unreliable Training L-only bypass with a versioned read-only
ownership bridge in a pinned v7.1.1 Training Modpack companion. Restores usual
shortcuts during ordinary Training gameplay; yields for actual menus, menu-close
cooldown, configured chords, recording/standby/lockout and playback. Keeps routing
fresh and observes physical releases while suspended; hides the assist panel and
stops recipe progression until Training releases input. Other battle modes and
standalone operation keep the normal policy. Stock Training without the bridge
disables Training assists explicitly instead of guessing input ownership. Adds
host bridge/handoff regressions, a pinned sparse-source preparation/build helper
and updated controls/integration docs. Matched NROs require Switch validation;
this does not establish zero conflicts with arbitrary mods.

Withdraws the companion Training bridge and its preparation tooling. Replaces
it with a small diagnostic-only, stock-Training workaround gated by diagnostic
feature + detected Training NRO + Training Mode: held L3 enables only ledge
trap/trump/menu, with L3 translated to L inside policy only. Release L3 or use a
default Training menu/save/record chord to pass physical input through. Retains
release tracking/session freshness; disables unrelated assists in a temporary
test settings copy. Silent builds, standalone consoles and other modes retain
normal controls/settings. No Training rebuild or new external plug-in required.
Adds isolation/handoff tests and updates docs. Source only; no build or upload.

Reuses attack-first ledge-walk preparation for Kirby Jump nair and Yoshi Neutral
nair. Walking uses existing wait frames only, brakes toward a six-unit inset
and never requires arrival before attack launch. Kirby Jump nair gains a brief
0.30 drift nudge; Neutral drift, Yoshi short-hop/fast-fall and attack timing stay
unchanged. Adds focused host regressions and updates fighter/sequence docs.

Fixes diagnostic Training L3 autopilot activation by reading the physical hold
independently of normal L's release-to-arm latch after resets/reassignment.
Menu edits/navigation and Training shortcuts still suspend responses. Silent
build and non-Training activation remain unchanged; adds hold/reset regressions.

Kirby Neutral Inhale now turns toward the ledge before its timed neutral-B
request. Jump bair replaces the failing tilt-cancel setup with a native-facing
confirmed grounded turn, paired X+ZL short hop and buffered bair in jump squat;
already back-facing Kirby skips the turn. Keeps drift and Neutral bair behavior.
Adds both-side direction regressions and updates Kirby execution documentation.

Replaces Kirby's Neutral get-up Forward tilt choice with stationary Down smash,
aiming protection expiry at frame 13, midway through its 7–19 active window.
Accounts for the neutral smash primer and releases A on native startup; adds
a timing/menu regression and refreshes Kirby's generated and authored docs.

Adjusts Yoshi Neutral nair for small-fighter coverage: launches eight frames
earlier (16-frame active lead) and permits fast fall on the first confirmed
nair descent instead of waiting until animation frame 15. Keeps paired short
hop, brief drift, optional approach and Jump nair unchanged. Adds descent and
launch regressions; updates timing docs. Height/contact require Switch testing.

Samus Roll Grab immediately prepares inward facing on roll recognition when
looking toward the ledge, then resumes existing grab positioning and timing.
Already inward-facing or issued grabs keep their existing path. Shared Dark
Samus recipes inherit the preparation. Adds mirrored direction regression/docs.

Fixes Samus/Dark Samus homing missile selection by pairing a deliberate 0.70
side input with B immediately on actionable option recognition across Neutral,
Jump, Roll and Drop. Removes homing's neutral primer and separate facing wait;
Super Missile keeps its prior flick path. Adds direction/dispatch/startup and
Super-preservation regressions, updates missile documentation. Switch validation
is still required for native missile selection and projectile contact.

Makes committed ledge input delivery respect native game progress across stalls:
fixed-size snapshots of both actors permit an expired request/session to survive
only after fresh identity, controller-route and unchanged native-state checks.
Progress, unknown clocks, release/menu edits and invalid actors retain normal
expiry/cancellation; waiting movement and unrelated assists keep their watchdogs.
No learned delay, timing offsets, network changes or new hooks. Applies to both
variants; adds frozen/progress/identity regressions and updates delivery docs.

Adds Pac-Man Fruit (stored) choices to Neutral and Jump get-up lists, preserving
defaults. With player-prepared fruit/trampoline/spacing, requests neutral B on
first actionable recognition without a vulnerability/travel wait; wrong-facing
turns first. Releases B on native entry to avoid continued fruit charge. No
auto-setup, item/article scans, fruit selection or trampoline edits. Adds both-
side dispatch/release tests and docs; red-trampoline conversion is unverified.

Adds independent fighter-configured onstage Roll read, initially Kirby only:
saved menu Off (default) / Down smash. Filters normal forward/back ground rolls,
tracks approach/body crossing with fixed-size state, and uses native instance
protection/recovery timing plus Kirby's active window and estimated reach.
No chase movement or ledge-roll setting changes; menu edits and higher-priority
assists cancel pending input. Off skips extra opponent reads; no new hooks,
item scans, delay learning or live files. Adds menu/geometry/input regressions
and documents separate opponent-distance/move-offset ledge calibration.

Fixes E0015 in both variants by initializing Roll read's empty output with a
const-compatible struct literal inside State::new. Gameplay behavior unchanged.

Improves held-L auto-shield: removes the idle/walk-only readiness prefilter,
uses native guard availability, widens the swept warning envelope to 24x28 units
over three frames, and forecasts configured opponents' tilt/down-smash/nair
startup up to three frames ahead. Adds a four-native-frame tail to bridge small
attack gaps without counting mapper polls or hitstop. Committed punishes retain
priority; release/readiness loss cancels immediately. No projectile/grab scans,
delay learning or new hooks. Adds startup/rate/hold regressions and updates docs.

Adds two manual ledge-spacing walk caps relative to the existing config baseline:
normal -0.02 (0.33 by default), near-full horizontal +0.03 (0.38), requiring
95% horizontal and at most 15% vertical input. Preserves fine/vertical control
and the 0.45 ceiling. Recipe movement, aerial drift and punish timing unchanged.
Updates movement regressions, config comments and maintained controls docs.
Adds lightweight Kirby held-L auto-duck as an opt-out exception to defensive
shielding. Starts with verified normal grounded Falcon Punch only; requires
early native crouch confirmation, near-stationary same-level solid-ground
spacing and normal sizes. Competing/late threats retain shielding and committed
punishes keep priority. Reuses the bounded roster pass and fixed-size state;
adds no hooks, weapon scans or live HUD. Updates policy tests and maintained docs.
Moves Kirby Auto-duck to an independent held-Y action with a saved Y mode row,
ready for future compiled modes; removes the B-reverse binding. Integrates
Kirby's in-range frame-4 down-tilt recovery forecast into normal held-L ledge
autopilot, without a separate L3 binding or toggle; other fighters do not inherit
it. Adds Kirby onstage Roll read Grab beside Off/Down smash, using standing-grab
timing, in-place facing confirmation and bounded delivery with immediate native
grab handback. Preserves ledge Roll grab and diagnostic Training's held-L3 test
scope. Updates regression coverage, control references and fighter documentation.
Reworks the saved menu as a transparent bottom-left single column with larger
outlined text, gold selection and colored mode/mash states, using cached strings
and the existing font. Minus now toggles visibility; Auto-mash is an editable
menu row. Diagnostic Training compatibility uses L3 for our menu while retaining
all configured gameplay features and normal L/Y/X controls. Training menu/save/
record shortcuts hand raw input back until a fresh L3 tap resumes with our menu
visible. No stock Training patch, new hooks, font assets or network changes.
Updates input handoff regressions, generated fighter references and docs.

Uses L3 to open/close the saved-options menu in all builds. X short-hop now
requests only X and releases it at native jump squat, avoiding injected ZL
shield/roll inputs with horizontal movement. X must be mapped to Jump. Updates
control references and focused host regressions; no Switch build or upload.


Makes menu visibility independent of the cached ImGui snapshot lock so an L3
close request suppresses drawing without waiting for text publication. Defaults
the configured onstage Roll read selection to Down smash; unsupported fighters
remain excluded. L3 itself blocks roll-read activation during menu toggles.
Adds close-after-edit/reopen regression coverage and verifies roll punish tests.
Source only; no Switch build or upload.


Removes committed-input stall preservation and its snapshots/native checks,
restoring the 35 ms request expiry and 250 ms observation-gap reset everywhere.
Yoshi Neutral nair enforces Short at execution, uses neutral X+A without ZL and
releases Jump in native squat; its existing timing lead/drift/fast fall remain.
Appends Yoshi Neutral Down smash using his front active frames 7-8 and the
normal smash primer/startup-release sequence. Updates docs and host regressions.
Source only; no Switch build, upload or hardware timing validation.


Changes menu open/close to the L3+R3 chord, accepting either press order and
one toggle per completed press; R3 alone retains turbo. Training shortcut
handoff resumes with the same chord. Yoshi defaults to Roll tongue grab and
Get-up Attack shield-grab; existing alternatives and nair drift are unchanged.
Adds chord/default regressions and refreshes controls and fighter references.
Source only; no Switch build or upload.


Yoshi Neutral and Jump nair now apply full forward stick only during confirmed
nair animation frames below 2, shortening the old 0.25-stick/below-4 nudge.
Other fighters retain their existing drift windows; attack timings are unchanged.
Updates fighter documentation and pulse/release host regression coverage.
Source only; no Switch build or upload.


Extends Yoshi Neutral and Jump nair full-forward drift to native animation
frame 30 (about half a second at normal speed), ending on landing/interruption.
Jump nair can retain a drift-only tail after its last hit; hitbox timings stay
unchanged. Neutral nair preserves descending fast fall during horizontal drift.
Updates docs and drift-tail/release regressions; no Switch build or upload.


Yoshi Neutral nair now faces the remembered ledge, confirms native facing and
immediately requests neutral X+A short hop on Neutral get-up recognition, with
no vulnerability-time/spacing gate or waiting walk. Existing full-forward drift,
jump release and descending fast fall remain. Adds unknown-timing and mirrored
turn/launch regressions; updates fighter execution docs. No build or upload.


Yoshi Jump nair now turns toward the remembered ledge and confirms native
facing before short-hop launch, matching Neutral nair preparation. A correctly
facing stance skips the turn. Aerial launch accepts native jump-ready turning
states without waiting for locomotion readiness. Existing drift and attack
timings remain. Extends mirrored-facing tests and docs; no build or upload.


Adds immediate Yoshi Neutral Dair: confirm ledge-facing stance, short-hop with
X and buffer down+A while releasing Jump in native squat, without timing or
spacing waits. Retains full forward drift through animation frame 30 after
dair acceptance; no automatic dair fast fall. Removes Yoshi Neutral Bair,
Forward tilt and Up tilt choices/handlers. Updates catalog, docs and mirrored
turn/jump/dair regressions. Source only; no Switch build or upload.


Raises the near-full-horizontal manual ledge-spacing cap to fixed 0.60, retaining
the slower baseline-minus-0.02 mode, threshold/vertical handling and digital
stick-flick suppression. Recipe movement and attack timing are unchanged.
Updates control/config references and host regressions; no build or upload.


Restores Yoshi Neutral and Jump nair to a brief full-stick forward nudge below
native nair animation frame 2, then neutral horizontal input. Neutral dair
retains its separate frame-30 drift window. Other timings and movement settings
are unchanged. Updates docs and nudge/release tests; no build or upload.


Fixes Kirby Neutral bair forward-facing tilt failure by removing its attack-
cancel route: prepare an owned 0.6-stick turnaround on recognition, confirm
native facing, then neutral X short hop and backward+A during squat. Neutral
launch does not inject ZL. Existing timing lead and drift remain. Adds mirrored
front/back-facing regression coverage and updates docs; no build or upload.


Replaces live Kirby Auto-duck's Falcon-only allowlist with active sphere/capsule
world-geometry checks for cached fighters and up to 32 remembered weapon/item
objects. A deferred ATTACK observer preserves its original arguments/call and
records IDs only while selected Kirby is present. Held-Y reads use six-frame
swept bounds and at most 32 active geometry slots; estimated crouch clearance
requests down, low/large contacts choose shield. Normal-size solid-floor/native
readiness gates and existing priorities remain. No hitbox/status writes. Adds
geometry/defense tests and documents estimated bounds, discovery limits and
required offline validation. No Switch build/upload or hardware safety claim.


Broadens Kirby onstage Down-smash roll read to nearby ordinary rolls without a
crossing requirement, observing up to 64 units and walking at 0.60 stick only
when native walk/brake data, floor support and recovery budget permit. Releases
movement in reach, uses the active window with a two-frame tail reserve, and bounds delivery
until native startup. Onstage Grab and ledge-roll responses remain unchanged.
Down-tilt trip follow-up now uses Down smash and recognizes grounded/downed
re-hit damage immediately after trip states; forward-tilt trips retain forward
smash. Adds approach, cancellation, nearby-roll and retrip tests and docs.
No new hooks for these changes, Switch build, upload or hardware guarantee.


Kirby Neutral down smash now uses its existing wait for a 0.65-stick ledge
approach with the six-unit inset, floor support and braking, without delaying
the frame-14 primer/frame-13 attack target for arrival or range. Explicit
horizontal flick suppression keeps opt-in approaches as analog walking. Jump
nair retains attack-first walking and now uses full forward drift after native
nair acceptance through frame 32, neutral at 33 or landing/interruption. Updates
priority/drift/input regressions and docs; no Switch build or upload.

Kirby's ledge Roll Grab now walks immediately to a fixed 27.5-unit inward ledge
inset, without tracking or reach subtraction, then uses existing timed grab
checks. Other fighters and onstage Roll read are unchanged. Host regressions
pass; this experimental spacing still needs Switch validation.
Kirby ledge Roll Grab now dashes toward a 24.5-unit inward ledge inset; Yoshi
uses the same fixed-stance approach at 20 units. Both retain one-unit arrival
tolerance, braking and existing grab timing/reach checks. Host regressions pass;
no Switch build or upload performed.
Kirby/Yoshi fixed ledge-roll grabs return to 0.65-stick walking, retaining
24.5/20-unit insets and one-unit tolerance; legal timed catches can interrupt
the approach before arrival. Kirby onstage Roll read takes over on recognition,
walks toward the short projection while waiting, and prioritizes the full native
7–19 down-smash timing window over arrival/range. No delay learning or new hooks.
Host regressions pass; Switch timing/spacing still need validation.
Kirby Drop short-hop dair now launches with neutral X, then buffers directional
down+A in native squat/takeoff instead of pairing Attack on the initial jump.
The saved menu omits appended spacing hints and narrows to 275 pixels at 720p,
retaining 21-pixel text and vertical wrapping. Host dair regression passes;
no Switch build or upload performed.
Advances Kirby Neutral get-up Down smash by two frames: neutral primer at 16
frames before predicted vulnerability and Down+A at 15, targeting protection
expiry at move frame 15 inside native activity 7–19. Keeps attack priority over
walking/arrival; other down-smash responses are unchanged. Host regressions
pass; no Switch build or upload performed.
Yoshi Neutral get-up Nair now immediately short-hops with X+ZL (both mapped
to Jump) and nudges toward the ledge, releasing both in squat. Neutral A waits
for a native-frame schedule from the takeoff protection snapshot, retaining
the 16-frame early-hit lead and existing accepted-nair drift/fast fall. Landing
or interruption cancels; unknown timing withholds A. Other nair recipes stay
unchanged. Adds delayed-input/short-hop regressions and docs; no Switch build
or upload performed.
Replaces Kirby's Y Auto-duck binding with a Finisher menu: one two-button
short-hop Fair 1 > upward Fsmash or Dair > Dsmash attempt per press. Fresh
hurtbox-hit confirmation gates the landing smash; shield/whiff, interruption,
mode edits and native-time limits cancel. Native startup releases charge and
held Y never loops. Auto-duck source tracking/scans and ATTACK observer hook
installation are disabled, including with old configs; legacy default is false.
No new hooks, enemy scans, runtime scripts or delay learning. Adds host route,
binding and cancellation tests plus docs. Switch spacing/timing/performance
still require validation; no Switch build or upload performed.
Adds a compiled opponent-reference snapshot for 90 native fighter kinds and
4,076 move entries: movement/weight/air physics, active spans, startup/total/
landing/autocancel facts, shield/damage and additional stats with source hashes.
No runtime JSON/network reads or opponent Kirby fallback; unknowns stay absent.
Adds an initially-Off Whiff punish menu row for Kirby/Yoshi, verifying known
grounded no-contact recovery against native motion, active hits, cancel ability
and end timing. Kirby chooses reachable Dtilt/Fsmash; Yoshi attempts a confirmed
turn, two-button short-hop bair drag-down into conditional landing Fsmash, also
available on Y. Shared input priority/Training/session fences remain; no new
hooks. Adds importer/data/policy/sequence tests and documentation. Initial
spacing, combo validity, static-data cost and performance need Switch testing;
no Switch build or upload performed.
Restores Yoshi's shared tracked walking ledge-roll grab. Kirby now runs to a
20-unit inward ledge inset, brakes within one unit and waits for native timed
grab contact instead of taking an early approach grab. Finisher starters buffer
directional A in confirmed jump squat, release both Jump buttons and retry
unaccepted attacks with native-progress hold/release gaps until exact aerial
acceptance. Adds regression coverage and documents static profile startup/cache
behavior. No version bump, Switch build, upload or on-device validation.
Verifies Yoshi's bair finisher shares Kirby's squat-buffered A delivery and
native-progress retry/release path. Extends raw-overlay regression coverage to
Yoshi in both directions, duplicate polls, hitstop, ignored attacks and exact
bair acceptance; existing turnaround/early-hit/landing-Fsmash checks remain.
Documentation updated; no gameplay timing changes, Switch build or upload.
Shares lazy, fixed-size per-observation fighter facts across all live assist
readers, with no retained native pointers or cross-callback cache. Centralizes
motion-progress arithmetic and event deduplication across action schedulers;
keeps existing move timing, transition allowances, rate bases, timeout policies
and freshness fences. Readiness/contact/geometry queries stay live. Adds snapshot
and clock regressions plus extension documentation; host-only validation, no
Switch build/upload or verified online/performance guarantee.
Restores Kirby down-tilt trip follow-ups to forward smash: the helper previously
explicitly selected down smash. Disconnects live whiff punish and removes its
menu row while retaining reference/prototype source. Onstage roll down smash
now requires approaching/crossing history, feasible movement and simultaneous
reach/vulnerability overlap; timing alone cannot force an out-of-range attack.
Adds explicit shared action ownership, interruption rules and losing-plan
cancellation, separating manual finishers from automatic fair confirms. Adds
policy and actual live-wiring host regressions; no Switch build/upload.
Removes a redundant preliminary shortcut assignment reported by the 1.6.5
build; final action ownership still selects and delivers shortcut inputs.
R3 alone now toggles the top-left single-line menu, with a separate classic
monitor-chord handoff. Adds opt-in Kirby idle crouch and down-tilt facing rows,
Yoshi onstage roll-smash/grab profiles with distinct front/rear sweep windows,
shared move input recipes and airborne directional-aerial selection. Kirby Fair
finisher waits for the short-hop apex and fast-falls during accepted startup.
Ledge trump slows near the boundary and countersteers on runoff; full horizontal
autopilot spacing requests maximum walk input with dash aliases suppressed.
Source/host checks only; on-console timing and monitoring still need validation.
Restores hold-L3 turbo teabag with the existing native-progress crouch/walk
oscillator; R3 remains dedicated to menu visibility. Legacy turbo config aliases
are preserved. No Switch build or upload performed for this control change.
Compacts the top-left menu with 19px reference text, tighter row spacing/padding
and a closer corner inset; retains bold shadows, colors and single-line rows.
Fixes idle crouch bobbing by retaining Down through native crouch states and
idle animation wraps; physical input and higher-priority actions still take over.
Changes Kirby Dtilt face to a downward-diagonal reversal toward the latest
opponent direction, including during down-tilt recovery. Preserves physical
mashed Attack edges; removes the standing-turn sequence and queued attack.
Fixes the Y Fair finisher dropping confirmed hits at frame 17. Any actual fair
hit, including landing-transition contact, now retains the up-angled Fsmash
follow-up and aims it toward the nearest opponent on landing. Dair is unchanged.
Caps full-horizontal manual autopilot spacing at 0.50 stick instead of 1.00,
retaining dash-flick suppression and the existing lighter-input walking cap.
Keeps the saved-options panel visible during default Training ZL save/load;
resumes on shortcut release without R3 and rearms held-L ledge practice only.
Persistent Training menus/recording retain their explicit R3 resume behavior.
Fixes Dtilt facing losing its horizontal reversal bits to the walk filter.
Uses a 0.80 downward-diagonal aim, preserves aim across down-tilt recovery gaps,
and discovers opponents with Dtilt face enabled independently of other assists.
Physical down-tilt aim now uses manual-tool priority over ledge preparation.

Kirby Idle crouch and Dtilt face default on; held L suspends idle crouch.
Adds default-on Jab > Grab: neutral held A confirms jab 1 and requests a legal
standing grab after six advancing frames; taps remain physical and held A does
not auto-pummel. Reuses manual action ownership and native catch readiness.

Dtilt facing prepares the directional Down angle before A and preserves manual
input priority through native down-tilt recovery gaps. Physical attack edges
remain unchanged; pre-attack aiming stays passive. Source/host checked only.

Adds default-off Yoshi Jab lock menu mode: only attributed down-tilt hits arm
a bounded ground-checked chase; missed techs attempt jab 1 into confirmed-lock
down smash, while techs attempt grabs using native readiness/recovery windows.
Shared detector and fighter policy; dedicated ownership overrides background
roll reads. No new hook or runtime file loads. Host checked; Switch tuning needed.

Fixes premature finisher cancellation while buffered Jump waits for native
acceptance: bounded 24-frame budget, released Jump, no added scheduling delay.
Native takeoff status/situation overlap no longer cancels finishers or shared
ledge aerials. Dtilt aim survives its hitstop and preserves physical tilt-stick
Down instead of clearing C-stick for left-stick-only ownership. Yoshi jab-lock
acceptance gets the same bounded budget. No delay learning or move-timing edits.
Host regressions added; online validation still required.

Moves Kirby jab-to-grab from held A to a neutral A+B chord; A alone is normal.
Consumes B before mapping to avoid A+B Smash, stands from crouch before jab,
confirms jab 1 and releases A even in hitstop, then waits for jab recovery and
native grab readiness. Releasing the chord keeps the committed attempt; bounded
delivery tolerates queued inputs. Capture returns control without automatic
pummels/specials. Updates controls/docs and host regressions; no build/upload.

Allows Down smash Roll read to acquire punishable rolls while shielding.
Releases physical/automatic shield and commits ownership through shield drop,
budgets shield-release plus attack/approach time, and attacks only on native
smash readiness. Shieldstun, late rolls and unknown timing remain excluded.
Adds held-shield and recovery regressions; no new hooks/reads or build/upload.

Unifies Yoshi neutral/jump get-up nair as immediate neutral Jump+A; buffers
Yoshi dair and Kirby jump bair in confirmed jump squat. Restores Kirby jump
nair's brief nudge and preserves manual spacing for neutral down smash.
Prepares grounded facing during protection and shortens rejected single-move
input retry gaps using native progress. Portable regressions only; no mod build
or Switch/online validation.

Prioritizes ledge trapping and roll reads over optional punishes and manual
helpers; only native safety responses interrupt their committed sequences.
Keeps crouch/turnaround-tilt assistance last, reserves armed ledge waits, and
removes lower-mode vetoes and stale input filters from timed punish delivery.
Portable ownership/integration checks only; no mod build or Switch validation.

Adds diagnostic-only readable mode/priority explanations and saved-choice
summaries, with fixed-size evidence batched at most four times per second and
formatted by the existing bounded background logger. Clarifies ledge outcomes
without claiming unverified hits. Stacks the compact diagnostic result below
saved options along the left edge. Portable checks only; no mod build/upload.

Restores the shared manual walk cap during armed ledge-autopilot waits for all
fighters. Explicit attack/drift inputs, owned release frames and roll reads
retain priority. Host regressions cover both directions across the compiled
fighter catalog; no mod build or Switch validation.

Allows Kirby Y starters through grounded walking, running, turning and braking,
with a bounded pending launch when native jump readiness changes. Jab-to-grab
uses actual native jab-cancel plus catch readiness instead of waiting for idle;
a short forward walk is only a legal fallback when catch is not yet available.
Preserves ledge/roll priority. Portable checks only; no mod build or Switch timing
claim, including no guaranteed 14-frame grab.

Fixes static live-state initialization by using a const-compatible jab-grab
readiness literal. The host integration check now compiles that production
initializer in a const context. No gameplay timing changes or mod build/upload.

Adds configurable adaptive auto-DI for all fighters: weak-launch attacker
separation or strong-launch survival-axis heuristics using copied reserved
launch velocity. Holds DI over the final three victim-hitstop observations,
shares safety priority with SDI, and yields to deliberate manual input. Bounded
cached calculations and diagnostic explanations; no trajectory/KO/combo guarantee,
mod build, upload or on-device validation.

Restores the pre-vertical-change shallow air-dodge slide vector (0.9588,
-0.2839). Buffers Guard in confirmed late jump squat/early native jump instead
of waiting for later airborne/readiness snapshots, handles mixed takeoff flags,
and retains pending hop/dodge ownership through native stop without new presses.
Host timing/angle regressions only; no mod build/upload or online validation.

Adds constant configurable spot-dodge defense against nearby ordinary standing,
dash and pivot grabs, using opponent timing/reach/facing plus a bounded roster
forecast. Requests Down+Guard only with native ground-dodge readiness, once per
observed grab, and yields to ledge/roll/punish priority. Includes diagnostic
proposal/acceptance evidence; command grabs and guaranteed collision avoidance
are not modeled. Host checks only; no mod build/upload or device validation.

Adds saved Spot punish and Grab dodge+punish toggles, with close down-smash and
far forward-smash recovery coverage. Roll D/F-smash mode gains far forward-smash
coverage. These option reads outrank ledge and other optional modes, remain
eligible while L is held, and share one input owner; native safety/readiness
still apply. Bounded copied-roster forecasts and one attempt per option; reach
estimates require calibration. No docs, mod build/upload or device validation.

Fixes the live grab-dodge handoff borrow through MutexGuard by ending the helper
borrow before recording the punish target. Adds a host compile/runtime regression
using the actual production handoff block and MutexGuard. No gameplay timing or
version changes; no mod build/upload.

Kirby jab-grab now gives one gentle forward frame at native recovery, then
retries grab with fresh native-frame presses until startup, without a range gate.

Adds a Kirby A+B menu choice between jab-to-grab and jab-to-down-smash,
with native-frame retries until startup and no Off selection.

Idle crouch now caps grounded walking below native dash onset and ducks near
opponents or observed duckable fighter/projectile hitboxes at posture priority.

Adds Crouch menu choices Auto, Always (idle), and Off, retaining posture priority.

Kirby combo starters can acquire airborne jumps/falls with a native floor/physics
landing forecast. Both routes retain descending Down through airtime; delayed
dair acceptance rearms its fast-fall flick. Automatic fair follow-ups also hold Down.

Auto-read smash, roll-grab and grab-dodge delivery now retries bounded native-frame
press/release inputs until acceptance while retaining reach/recovery checks. Frozen
idle clocks use observed opponent progress; no fixed network-delay offset is added.

Audits remaining native input delivery: opening jab and jab-lock requests now
retry with release gaps until acceptance, retaining live legality/range windows.

Restores original idle-only crouch and On/Off menu, removing proximity, hitbox
and walk-cap changes. Fixes airborne starter ray closure f32 inference.

Sets the requested release version to 1.7.1 for versioned build output.

Diagnostic snapshots now explain every mode, native actions and animation frames.
The left menu shows live mode snapshots alongside completed ledge results;
stale-match cards are invalidated and SD write/flush failures are reported.

Verifies idle crouch yields immediately to every other action owner, including
spot/grab punish preparation, without blocking proposal generation.

X short hop retains fresh grounded presses through native stop. Kirby combo
starters request X immediately without ZL or a jump-term wait, preserve takeoff
stick input, and release at native squat while retaining higher-mode priorities.

Audits shared offline/online input paths. Cancels stale/interrupted dash pivot
and dash-walk before cached output and on combat takeover. Trip/fair follow-up
pulses and ledge-trump timeout now require native motion progress, not changed
target/hit/geometry facts. Roll reads reject large clock gaps and preserve grab
tracking across roster slot changes. Repairs the portable menu test imports.
Keeps held physical X suppressed after short-hop ownership ends, while other
owners' explicitly requested synthetic jumps remain deliverable.
Manual attack/jump/shield/C-stick input also cancels dash assistance before
native startup feedback, preserving the physical action's directional input.

Fixes A+B follow-up stalling when its one-frame forward input has no separately
observed WALK state: begin native grab/down-smash retries after that input.
Marks the X shortcut's mapped jump with native JumpMini, preserving its held-X
quarantine and other modes' full hops without injecting shield or attack.

Adds Kirby Neutral -> Cross-up grab as a separate saved ledge option. Attempts
a bounded grounded crossing toward the ledge side, confirms inward facing,
then times standing-grab delivery against observed getup protection/recovery.
Keeps an edge inset, ground probes, native-clock retries and existing priority;
hands back on a blocked/expired attempt, target loss or native grab startup.

Fixes combo starters full-hopping under delayed online startup feedback by
applying native JumpMini to their owned takeoff requests as well as physical X.
Verifies fair selection precedes the descending Down flick, then holds Down
through duplicate polls/hitstop until landing without repeated jumps.

Fixes the separate automatic manual fair-1 -> Fsmash helper forgetting its hit
at frame 17, normal falling, or skipped native observations. Retains confirmed
hit 1 until landing and buffers upward Fsmash through landing lag, with native
startup release and damage/grab/dodge interruption. Handles mixed landing flags
and first-hit evidence reported on the immediate landing transition.

Reduces silent-build observation overhead without lowering reaction cadence:
skips already-published callback setup after route refresh while retaining
roster discovery, reuses identical floor-support probes only within a callback,
omits floor forecasts unused by grounded combo starts/held rejected triggers,
and prunes far-side ledge probes that cannot beat an already found nearer edge.

Prevents menu/result overlays lingering after leaving Elite/warmup matchmaking:
requires a fresh connected local fighter for mapper visibility and adds a
render-side fighter-observation timeout when callbacks stop. Saved choices
remain cached; stale diagnostic cards clear when the display expires.

Removes live recovery/two-frame interception and its opponent scans/forced ledge
searches. Combo buttons now start only grounded; deletes airborne-entry floor
rays and landing prediction, retaining grounded short hops, fast-fall and hit
follow-ups. Consolidates mode-setting locks, shares repeated target direction,
and skips disabled grab-roster and movement-only attack-readiness queries.

Gates ledge attack-readiness and jump-physics observations behind same-pass
ledge/getup acquisition or an ongoing response, retaining automatic positioning
and target-loss follow-ups. Completed visits stop tracking ordinary onstage
targets; approach threat scans yield to the ledge policy's own shield responses.

Defers roll/grab-dodge/recovery-punish readiness queries until a matching option
is observed, retaining same-observation responses and empty-target cleanup.
Skips disabled recovery profile lookups and turnaround-tilt enemy scans outside
usable grounded states, retaining down-tilt hitstop buffering and fair re-aiming.

Reserves detected ledge visits against general roll/spot/grab read owners,
including previously committed reads, while preserving safety priority and
normal reads between visits. Idle crouch yields on physical button history
and release edges as well as active buttons, movement and higher-priority tools.

Makes automatic smash retries less mechanical: the first eligible smash remains
immediate, while ignored inputs retry with short uneven press/release bursts
driven only by native game-clock progress, not repeated online controller polls.

Adds a Brother control-layout preset for R/ZR Jump, ZL Shield, L Special and X
Grab, translating assist actions while moving held ledge assist to L3. The
existing enabled=false setting now bypasses mapper and fighter observation work
at the earliest safe point for low-overhead unassisted play after restart.
Kirby's neutral-getup nair now short-hops immediately, drifts fully inward, and
delays nair five native updates; jump-getup nair attacks immediately. Cross-up
grab now rolls straight toward the ledge and grabs as soon as native roll ends.
Restores the canonical mapped-button value in the final mapper composition
scope, fixing all movement, shortcut, jab and posture references in live builds.
Adds a version-only multi-Switch uploader with fixed safe routing: .105 receives
silent and .142 receives diagnostic, while both retain backup/hash verification.
Marks committed short-hop ledge Nair takeoff samples as native JumpMini, keeping
Kirby's neutral- and jump-getup Nair hops short even with delayed online status.
Fixes Kirby's ledge-roll grab missing long native rolls: observed inward root
travel now extends the walking catch point instead of chasing a stale fixed spot.
Diagnostic upload confirmation is now limited to .105; the fixed .142 diagnostic
route runs directly, while the multi-Switch wrapper always assigns .105 silent.
Adds build_variants.py -upload: after both variants build and package successfully,
it runs the version-matched fixed silent/diagnostic multi-Switch upload command.
Keeps native JumpMini tied to the committed short-hop recipe plus the cached
ledge X request, avoiding loss when mapper timing and policy output differ.
Carries the short-hop marker in the cached ledge output across pre-map state
updates so delayed online takeoff requests retain native JumpMini.

Fixes Kirby Neutral/Jump get-up nairs and Yoshi ledge nairs to mark their
committed launches as native short hops through final mapping. Kirby Neutral
nair delays A by five native animation frames with 25% inward drift; Jump nair
pairs A immediately with 50% drift. Yoshi's facing-independent nairs launch
immediately and retain their brief 25% nudge. Kirby Neutral down tilt and down
smash use earlier observed vulnerability/delivery edges while retaining their
real active windows. Adds focused host regressions; no mod build or upload was
performed.

Makes Yoshi's bair-to-Fsmash starter retain its native short-hop marker and
hold Down from the aerial apex for the earliest legal fast fall. Grounded
canonical X now requests JumpMini independently of fighter and higher-priority
policy ownership. D-pad Left/Right replace the former slide shortcut with
bounded left/right B-reverse sequences; the legacy config key remains accepted.

Replaces Kirby's simultaneous A+B jab-follow-up trigger with a physical Jab 1,
A release, then fresh mapped-Grab press. The Grab edge is consumed during jab;
native recovery/cancel readiness then drives one forward frame followed by the
selected Grab or down-smash retry at the earliest legal offline/online frame.

Retains a fresh D-pad Left/Right B-reverse direction across the one-observation
native transition-readiness lag. Once neutral special becomes legal it emits
the complete neutral, Special, directional-flick sequence without analog help.

Yoshi's bair-to-Fsmash starter now launches directly from full sprint with a
one-shot short hop plus full reverse input, retains the turnaround through jump
squat, then attacks and drifts back toward the target before its fast fall.

Yoshi's neutral-getup Nair punish now waits ten advancing native frames after
recognizing Cliff Climb before beginning its existing short-hop Nair sequence.

Yoshi's jump-getup Nair now uses 50% inward drift after native Nair acceptance;
neutral-getup Nair retains its separate 25% drift and ten-frame pause.

Extends Yoshi's jump-getup Nair to full inward drift through Nair frame 8;
neutral-getup Nair keeps 25% strength but now retains it through frame 6.

Removes Yoshi's neutral-getup Nair pause while retaining its extended 25%
drift, and keeps jump-getup Nair at full drift. Yoshi's neutral-getup forward
and down smashes now schedule one native frame earlier so their first active
windows meet protection expiry instead of arriving after shielding is legal.

Kirby's Neutral/Jump get-up Nairs now emit exactly one mapped short-hop Jump
edge instead of retrying AX after a release gap while native squat feedback is
delayed. Down tilt, down smash and grounded Stone schedule one additional native
frame early to account for their observed training-room delivery offset.

Adds an allocation-free declarative ledge-response sequence layer with named
face, walk, run, hop, move, drift and range-aware grab actions for all five ledge
situations, while retaining custom-handler escape hatches and the existing
native-confirmed execution engines. Migrates Kirby's Neutral and Jump Nair
recipes to readable action lists without changing their corrected input timing.

Adds opt-in Kirby Neutral `[TEST]` choices for training-room validation of the
shared sequence vocabulary: facing plus exact-distance walk/run, short/full hop,
delayed Nair, turnaround Bair, drift, grounded down smash/down special, and
profile/explicit/unverified grab ranges. Multi-frame preparation remains bound
to its recognized getup recipe until the native action engine takes ownership.

Hardens sequence recipes for offline/online sampling: duplicate mapper polls
remain cached and stopped jump-squat frames cannot bypass a delayed Nair attack.
The onstage smash reader now recognizes bounded same-roll side swaps and early
overlapping departures, covering shield-faceoff rolls whose approaching sample
was skipped, while ordinary away rolls and large clock gaps remain rejected.
Keeps paired file short-hop aerial Jump+Attack inputs held together until native jump confirmation, then releases Jump with Attack buffered through squat. Preserves explicit waits and legacy staged aerials; adds delayed-delivery regression coverage without extra scans or file reads.
Full FTP uploads always use current deployment sequences.txt instead of saved release copies, require the deployment file before connecting, print its source path, and preserve backup/read-back verification.
Sequence-only uploads validate the exact payload using the shared Rust startup parser and silent/diagnostic fighter-menu validation before FTP, including dry runs, with readable failures and an offline cached host validator.
Adds opt-in timed walk-to-opponent and short-hop drift-to-opponent before Nair actions with stick strength, maximum native frames and target gap. Neutralizes the stick for Nair selection, follows existing opponent snapshots, and pauses timers during hitstop without extra probes or gameplay allocations; existing paired aerial and post-attack drift recipes retain their behavior.
Corrects deployment Yoshi roll-grab facing by removing the conflicting face-away command and labels walking recipes to match their actual eight-unit movement; preserves choice IDs, timings, strengths and range checks.
Adds opt-in ordered grounded Face/Wait prefixes with observed turn confirmation, native-progress waits and bounded turn timeout. Configures Yoshi grab_shuffle to wait five frames, face away, wait five, face opponent, walk ten units at 40 percent stick and range-check the grab; preserves ordinary preparation, aerial and attack paths and adds offline/delayed-input regressions without new gameplay scans or allocations.
Adds an optional opponent gap to distance-based file Walk actions with momentum/input-delay stopping allowance, existing ground-safety checks and completion latching to avoid chasing past the opponent. Applies a three-unit gap to Yoshi nair_v3 while retaining its four-unit travel cap and 80 percent stick; preserves legacy Walk behavior and adds parser and movement regressions without new probes or scans.
Enables opponent spot-dodge punish reads and their menu toggle in silent as well as diagnostic builds, defaulting Spot punish and Auto-tech ON. Updates fallback/deployment auto-tech defaults while preserving explicit OFF configuration, toggles, master-disable gates and diagnostic-only grab-dodge/trump modes; adds menu/default regressions.

Adds grounded Kirby Final Cutter to text-file sequences as up_special, Up B or Final Cutter, with native-start input release and startup validation.

Extends text-file up_special / Up B to every configured fighter using universal native startup confirmation, without assuming fighter-specific hitbox timings.

Adds universal grounded text-file dash_attack / Dash Attack with native dash confirmation before A, startup release, and bounded ground-checked setup.

Disables the invalid hop-plus-Up-Special deployment recipe that blocked sequence startup, preserves its text as comments, and documents validation troubleshooting.

Refactors file ledge recipes into fixed ordered input timelines with universal ground/air moves, multi-attack chains, explicit holds/waits/delays, raw button and stick controls, optional spatial gates and startup-bound code handlers. Preserves native-progress online/stop deduplication, cancels unverifiable clock gaps, skips rich observation for literal timelines, restores hop-to-Up-B and repairs duplicate deployment IDs.

Moves all 1,515 fighter ledge menu options and their scheduling into sequences.txt with required per-option start_delay, file defaults and ordered input waits. Removes the compiled fighter option/recipe dispatcher, old code bindings, native scheduling leads and config.txt timing overrides; keeps only shared recognition, observation clocks and explicit spatial/block gates. Preserves custom recipes, removes their duplicate Kirby header, and documents input-only operation without changing native physics, hitboxes, move definitions or animation speed.

Handles zero-rate poses using a read-only locked-opponent clock fallback without roster/ray/readiness scans, avoids double-counting actors or backfilling hitstop gaps, and normalizes native float roundoff at input-frame boundaries.

Adds a lazy per-fighter RAM recipe editor and six-slot Custom choice in each ledge row, with editable initial/per-action delays, action types and bounded movement parameters. Caches resolved edits by revision, cancels input during editing, and enlarges the cached menu display without gameplay parsing or file writes.

Clarifies in-game recipe timing labels, distinguishes neutral pauses from input holds and movement duration, and adds selected-field help and navigation position without changing execution timing.

Removes Wait from the in-game action picker, translates existing file pauses into editable action delays, and groups indented settings beneath move names while preserving execution timing.

Adds bounded hold-to-repeat acceleration for numeric recipe fields, retaining precise taps and tap-only move/direction selection; clears repeat state on release and editor/input boundaries.

Defaults newly selected in-game input actions to four-frame holds while preserving existing file recipes and saved RAM action durations.

Fixes duplicate Yoshi Neutral defaults in the deployment sequence catalog while preserving both custom Nair recipes and their timings. Validates all 1,538 sections against silent and diagnostic startup rules.

Removes an invalid trailing colon from the custom Yoshi Neutral walk action; startup validation identifies a separate incomplete Yoshi Jump approach action for correction.

Adds X test/stop for the highlighted ledge recipe using the existing native-clock input timeline and current RAM settings. Runs once without requiring a getup, uses a real opponent, disables automatic positioning, cancels on menu changes/transitions, and reserves the test button through release to prevent jump leakage.

Replaces the full-width menu strip with a compact high-contrast focused-row card, readable fixed text, wrapped labels and option position. Limits recipe editing to the selected move and indented settings, with shorter contextual help and no gameplay/configuration changes.

Changes Yoshi roll Tongue grab to inward four-unit walking followed by opponent-facing range-gated grab. Shares exact-byte Rust sequence validation across sequence-only and full deployment uploaders, adds local check-only mode and section/line error context, and rejects invalid files before FTP work.

Preserves owned sequence walking analog strengths in the final mapped controller packet while retaining flick-alias suppression, native deadzones and movement physics. Limits forwarding to active distance-walk and grounded approach steps, with no timing or custom recipe changes.

Adds explicit Y Save in the in-game recipe editor, with a lazy bounded background writer, saved/unsaved status and snapshot validation. Persists only the chosen recipe actions/timings, preserves unrelated sections/labels/defaults, appends named Custom recipes, verifies a backup and temporary file before replacement, and rejects invalid catalogs or conflicting file edits. Adds standalone range serialization and portable save/round-trip/filesystem safety checks.

Fixes false sequence cancellation when grounded walking/running animation rates change: recognizes a single update advanced at the new native rate instead of dividing by the old rate. Preserves duplicate/stall and stable-rate gap handling, input strengths, attack clocks and all custom recipes; adds forward/reverse movement regressions across walk and drift strengths.

Corrects fighter-range grab gates to use each selected fighter reference instead of the global range; Yoshi now checks range before facing and grabbing. Adds diagnostic-only controller list management for rename/add/duplicate/delete, stable draft indices and validated backed-up persistence. Pins numbered slot overviews and unsaved/last-change indicators while editing, suppresses unused-slot settings, and preserves explicit recipe inputs when menu buttons share bindings.

Fixes Switch menu-save error 514 by setting both creation flags required by the installed Skyline filesystem backend. Closes the temporary writer before read-back, supports destination-exists rename errors with preserved-original rollback, and recovers interrupted replacements before startup/next save; retains validation, verified backups and refusal to overwrite unrelated temporary files. Adds Switch-style rename/failure/recovery regressions.

Reworks the saved-option/editor presentation into a right-corner column with complete numbered move groups and compact per-action settings, pinned controls/status, exact field highlighting and focus-following overflow scrolling. Shows all configured actions in preview and editing, labels left/right stick axes, and moves diagnostic snapshots, performance/calibration cards and the master toast to the right using only existing ImGui bindings. Execution, input controls and configuration data are unchanged.

Adds opt-in per-fighter X/Y sequence menus with the existing action editor, executor and diagnostic list manager. Preserves native bindings until configured, runs once per fresh press outside the menu, retains menu Test/Save controls, persists selected bindings including Native, and cancels on existing lifecycle/ownership boundaries. Extends the validated text schema with x/y sections, primes an absent opponent cache through the existing fighter callback, and preserves explicitly owned synthetic button inputs without recursive triggers or new dependencies.

Keeps sequence frame timing advancing during held edge-balancing poses by sampling the already tracked opponent clock, preserving duplicate-update and hitstop pauses without changing game physics, move data or configured recipes.


Adds a compact first-page ledge selector before the full editor: Minus cycles quick selection, full menu, and closed. Shows all five selected ledge responses together, cycles existing saved recipes without exposing blank templates or edit/test/manage commands, and preserves recipe data and input-release safeguards.


Preserves active SD sequences.txt during full and sequence-only FTP uploads by sending the validated deployment copy as sequences.upload.txt. Separates the UI into quick selection, sequence editing, and an all-visible modes page before closing; limits the editor to ledge and X/Y recipes, and adds saved X/Y plus Native switching to the compact selector without changing existing recipes or gameplay policies.


Adds an explicit diagnostic-to-silent sequence sync tool: downloads and validates the diagnostic active file, preserves unique local snapshots plus a verified silent SD backup, verifies replacement by SHA-256, and attempts rollback after transfer failure. Ordinary suffixed uploads remain unchanged; dry-run only reads diagnostic and no mod build or transfer runs automatically.


Restores ordinary gameplay button passthrough in the compact selector instead of swallowing A/B/L/Y and stick-click inputs. Reserves X for one-shot highlighted recipe testing/stopping, displays test status, cancels tests on manual actions or navigation, and retains held-X quarantine plus Native-binding guards without changing recipe or game data.


Changes compact-selector and modes-page navigation to Up/Down for rows and Left/Right for hovered values, including ON/OFF switches and X/Y saved recipes. Keeps sequence/action editor controls unchanged and updates the cached control hints.


Anchors all silent-build menu pages to the bottom-left with auto-size growth upward, while diagnostic menu pages and their result panels retain the top-right layout. Controls, recipes and gameplay behavior remain unchanged.


Limits Kirby idle crouch to an enemy within 45 horizontal and 20 vertical units, reusing one bounded roster observation for proximity and tilt facing. Restricts pass-through platform tech rays to descending floor probes, withholds automatic guard when native damage recovery permits air escape, and cancels stale tech requests outside supported tumble/capture states. Keeps game physics, move data, native lockout and sequence recipes unchanged.


Adds OFF-by-default per-fighter grounded spacing assistance and Modes controls for gap, tolerance and observed-hitbox margin. Uses bounded read-only fighter geometry and shared floor probes to propose approach/retreat or grounded shield, with manual-input override and existing committed-action priority. Adds native analog forwarding, diagnostic evidence and portable regressions; no projectile coverage, air dodges, physics edits or perfect-avoidance guarantee.


Restores held-L ledge trapping while the compact selector is visible. Preserves L readiness through compact navigation and consumes L as the existing assist trigger rather than a native shield press; directions and X remain isolated, with tests canceled on L takeover and held-L assistance resuming after navigation release.


Fixes menu-save validation retaining whole startup catalogs on every save by checking temporary parsed data without publishing process-lifetime menu references. Bounds actual save/recovery file reads to 512 KiB, fixes the worker stack at 2 MiB, and adds repeated-save allocation and oversized-read regressions while preserving backup, verification and rollback behavior.


Adds a last-used-fighter editor on confirmed non-battle screens through the existing ImGui host, with explicit cached-profile labeling, fresh-boot/no-fighter refusal, gameplay/test suppression and existing background saves. Resolves complete named SDK single/bulk controller-read pairs for input isolation, bypasses filtering for raw menu reads, fences held input/history on close, and expires capture on renderer loss or match entry. Unsupported/unknown paths stay unavailable; no fighter selection, physics, hitbox or network modifications.


Refreshes menu styling with darker rounded panels, teal selection cards and state colors, hides on-screen control tips while preserving save/errors, slot indices and values, and anchors silent menus top-left while diagnostics remain top-right. Changes Minus to compact/modes/closed and opens the highlighted recipe directly with R3; R3 or Minus returns from editing to compact without discarding edits.


Sequence transfer now accepts --from diagnostic or --from silent to copy active recipes in either direction, preserving source files and destination backups, validation, and read-back verification.

Recipe editor clarifies button-hold frames, preserves and describes imported input choices when cycling, distinguishes numeric and fighter grab-range checks, and exposes shield-hit/facing checks with clear names. The old native Y combo/Finisher binding is disabled in favor of swappable X/Y input recipes; normal unconfigured Y passes through. Existing saved sequences are preserved.

Moves menu save startup out of active battles: Save queues a recipe snapshot and the existing verified outside-battle editor path starts the worker after the match lock clears. Repeated requests update the same pending recipe, with explicit queued status; backup, verification and rollback remain intact. Catalog parsing reserves its large roster buffer once with fallible allocation to reduce save-time peak memory, with queue and allocation regressions.

Removes the live A+B jab-to-grab producer and menu row. X/Y input recipes now form shared universal libraries with shared selections, edits, names and diagnostic list management across fighters, while ledge recipes remain local. Legacy fighter button sections migrate on explicit save with collision-safe IDs and preserved inputs; frozen button lists are reused across profiles, and save/transfer validation accepts universal X/Y headers.

Reduces save/fighter-switch resource pressure: shared X/Y snapshots update from recipe/selection changes instead of unrelated UI revisions, and inactive fighters release redundant button-editor data while keeping ledge edits. Catalog validation counts each row once, and each queued save worker exits after its job instead of retaining an idle thread and 2 MiB stack across matches. Config contents and gameplay behavior are preserved, with worker-lifecycle, allocation and sharing regressions.

Audits auto-tech performance and removes redundant construction of all body probes during each ray refinement. Preserves collision query order/count, coverage, platform flags, contact resolution and scheduler timing, with bit-exact equivalence coverage. Movement actions were reviewed without changing their behavior pending confirmation.

With explicit movement approval, fixes only Backward Drift to capture its starting direction once per action so native turnarounds cannot alternate its horizontal stick. Preserves strengths, frame durations, duplicate-poll handling and every other movement direction; adds grounded/airborne, turnaround and consecutive-step regressions.

Audits hot-path reuse without reducing polling or detection frequency: prepares identical immutable grab-reference facts once before hooks, reuses fighter-kind facts and a last-identity lookup cursor within one observation, classifies X/Y bindings without full action-array copies, and rebuilds diagnostic configuration only on relevant changes. Preserves fresh attack/readiness/contact queries and all movement/timing behavior, with cache and binding-equivalence regressions.

Removes experimental automatic Spacing assist completely: dedicated observer/predictor modules, runtime state and proposals, menu settings, roster-demand flag and diagnostics ownership. Preserves manual walking, file movement actions, held-L positioning/defense, sequences and all other settings.

Removes all universal and fighter-specific X/Y recipe bindings, menu rows, shared caches, metadata classification and extra runtime slots. Restores X to the existing short-hop shortcut and stops consuming gameplay Y so native mapping passes through. Retired X/Y file sections are ignored for compatibility and preserved during ledge saves; runtime settings now contain only five ledge response slots. Ledge recipes, simulated X/Y actions inside them, menu test/save controls and game physics are preserved.

Restores fighter-specific X/Y recipe lists, editing and one-shot button activation without universal mappings or shared caches. Normal button retains X short hop or ordinary Y input. Removes outside-battle recipe editing, last-used-fighter tracking and dedicated SDK controller interception hooks; menus are battle-only. Preserves queued one-shot safe-scene SD saves, ledge recipes and all game physics, detection and input timing.


Adds opt-in diagnostic runtime health measurements for mapping/menu/draw/save/logger work, callback gaps, rebuilds, state/profile churn, retained editable menu payload, save-worker lifetime and logger backlog. Keeps fixed counters and nonblocking sampled timing separate from gameplay policies; lifetime totals survive window resets. Splits enabled performance reports into performance.log while other evidence remains in status.log, sharing one bounded logger worker. Silent builds exclude the instrumentation; no physics, action timing or detection frequency changes.


Fixes startup validation of fighter-specific X/Y lists with saved non-default recipes: the permanent Normal button entry at the end of the file choices is valid. Preserves default selections and strict bounds for ledge/custom entries; adds save-to-restart and both-build regressions. Prevents a valid first button save from disabling the mod on the next boot without changing inputs or game physics.


Adds fighter-specific D-pad Up/Down/Left/Right bindings beside X/Y, supporting saved/custom input timelines or registered mode targets with Hold/Toggle activation. Splits menu pages into ledge traps, six button configs and mode toggles while preserving R3 editing, input-release fencing and safe saves. Removes native hard-coded D-pad B-reverse/Down-trump triggers, routes active mode bindings to existing policies in both builds, and keeps inactive bindings to fixed identity checks without extra observations. Adds mode/sequence save-restart, parser, page/navigation and hold/toggle regressions; preserves physics and all authored input timing.


Adds cached recipe-editor frame spans and nominal total input time, with F1 tied to recognition and conditional movement/check timing marked variable; excludes move startup/recovery and respects displayed timeout limits. Reviews pinned Ultimate Training Modpack runtime patterns without copying forced-status/physics mechanisms. Skips unused rejected-state tech velocity reads in silent while preserving all prediction gates, geometry, windows and acknowledgment, and corrects raw-input diagnostic explanations that inferred failures from missing optional samples.


Makes automatic DI survival-focused by default and for legacy Adaptive configs, keeping aggressive attacker-separation DI explicit. Survival candidate scoring rejects modeled LSI launch-speed increases. DI/SDI immediately respect physical stick input held before or during a hit; SDI reserves the final three launch-input frames even when DI is unavailable, and invalid stick data abstains. Preserves input-only operation with no new native reads, rays, physics/status changes or heavy prediction, with direction/manual-control/handoff regressions.


Fixes startup stack exhaustion after expanding button menus: constructs the 77 fighter profiles individually from a static constructor table instead of materializing a roughly 25 KiB profile array under config/parser frames on the 64 KiB loader stack. Preserves identities, saved X/Y/D-pad recipes and defaults, avoids bulk profile collection/sorting and adds a small-stack host regression. No game physics, inputs, gameplay timing or new worker changes.

Adds Yoshi to the existing input-only Dtilt face helper, including physical down Tilt-stick with a neutral left stick; preserves attack edges and adds no wait. Gates facing reads on Down intent/recovery. Extends optional Yoshi Jab lock to bounded nearby native tumble/knockdown/tech visits including late aerial setups, retaining grounded/floor/transition/vulnerability checks, target identity and native-progress clocks; runs only at long approach distance and walks near punish range. Adds focused facing, availability and chase regressions. No physics, hitbox, status writes or new workers.

Improves descending floor/platform tech forecasts using a bounded recent native velocity trend and at most fifteen short floor rays within the existing five-frame horizon. Falls back to linear prediction on unknown/discontinuous motion, clears one-record history with session resets and preserves wall/ceiling rays, native eligibility, air-dodge suppression, cooldown and input-only behavior. Adds floor-gap, query-budget, fallback and native-clock regressions; no physics/status writes or new worker.

Adds an optional per-fighter Out of shield mode, initially Yoshi only, with confirmed native shield-attacker tracking, shieldstun/multihit retention, projected front grab or close short-hop Nair and configurable fighter response lists including a future up-special input route. Adds Hold/Toggle bindings, mode UI and diagnostics while protecting reserved ledge responses and file timelines. Improves held-L approach shielding with five-frame compiled startup warnings and bounded read-only active-hitbox geometry for extended/descending attacks; passive jump tracking no longer suppresses defense. Adds focused choice, ownership, geometry, binding and native-acceptance regressions. No physics/hitbox/status writes, new hook/worker or config replacement.

Fixes standing C-stick Dtilt face detection for Kirby/Yoshi by using the real pre-map right-stick axes before digital Down aliases appear. Routes the same Down intent through opponent observation and facing preparation, angles an existing down C-stick flick alongside the left-stick turn request, preserves attack edges and restores controller axes after mapping. Adds standing/crouching first-poll, release, side/up-input and aerial regressions. No crouch prerequisite, input wait, extra scan/worker or physics/status write.

Removes every Hold/Toggle mode from X/Y/D-pad button choices and editors: buttons now select input sequences or Normal only, with modes controlled exclusively by existing ON/OFF rows. Removes per-poll mode override/toggle handling and its fields. Preserves legacy file parsing but excludes old mode sections from runtime choices without rewriting saved files; obsolete defaults safely choose Normal while retaining authored input recipes. Adds all-mode/all-button compatibility, sequence preservation and menu regressions. No gameplay timing, physics or saved-file changes.

Exposes the existing bounded ordinary-grab spot-dodge detector as an OFF-by-default Grab dodge ON/OFF mode in both builds, with no button binding or automatic punish follow-up. Completes its six-frame interception sweep with thirteen half-frame arithmetic steps and removes unused avoided-grab punish tracking/recovery reads. Fixes OOS lingering neutral-stick/shield ownership when no punish exists, revalidates queued punish reach/recovery while retaining online acceptance through readiness changes, and adds diagnostic-only movement-override owner events with no new game reads. Adds forecast, release/forward-input, queue and mode visibility regressions. No movement recipe, physics/hitbox/status writes, new hook/worker or upload.

Improves diagnostic evidence for intermittent neutral-getup whiffs: raw neutral attack reports stay open beyond short recipe completion and retain first native attack activity plus first activity during opponent vulnerability, with getup frame/protection/recovery and relative gap/height. Uses two bounded copied records and diagnostic-only native active-slot reads outside STATE locks, with existing worker/watchdog; adds report lifecycle/evidence regressions. No gameplay input, move timing, sequences, physics or hitbox changes.

Makes diagnostic logs easier to triage for latency/workload investigations: adds worker-formatted review codes, full-evaluation/input-expiry/publication/clock-cancellation rates, bounded retained/save trend hints and logger-overhead flags. Adds a diagnostic-only manual external-delay label (unset or 0–30f) with fresh Perf epochs, frozen input request/mapper-ack/observed timing evidence, hook-boundary caveats and explicit sequence termination reasons. Keeps two existing logs and the existing worker/queue, with no new native query/hook/worker, automatic delay compensation or silent logging. Adds label isolation, triage, clock-delta and termination regressions; updates Training trial guidance. Gameplay timing, detection, physics and uploaded files are unchanged.

Adds an explicit temporary silent-probe build for one match of bounded SD-only aggregate counters and 1/64 elapsed observation samples, with a 10-second writer interval, 32KiB/10-minute cap and persistent existing-file latch. Normal builds exclude the probe; no new game hooks, native queries, network output or gameplay timing changes. Adds opt-in packaging/marker checks and probe lifecycle/cap tests.

Fixes temporary silent-probe log creation on Switch by supplying both create and create_new flags required by its std filesystem implementation. Preserves existing-file refusal, one-match limits and all gameplay behavior.

Improves stage-tech input coverage: distinguishes grounded Ganondorf Flame Choke release from the shared aerial release using native previous status, preserving mapped-edge cooldown and aerial exclusion. Runs the existing bounded collision forecast during the final five known damage-hitstop frames instead of two to give floor impacts more input lead. Adds grounded/aerial release and hitstop scheduling regressions; retains air-dodge/passive-disabled gates, native lockouts and input-only behavior. No build or upload.

Enables the existing Training Modpack shortcut/menu/save-load handoff in silent as well as diagnostic builds, using a startup plugin-presence check and Training-only runtime gate. Removes the logging-feature dependency while retaining configured gameplay features and normal controls outside Training. Updates compatibility regression coverage and docs; silent logging/probe remain disabled unless explicitly built in. No new hooks or native gameplay writes.

Fixes configured continuous button holds being cancelled by valid observation gaps wholly inside the same active hold. Retains one press edge and the scheduled release, with aborts for crossed action boundaries, invalid clocks, damage and cancellation. Adds held-A duration/edge and missed-release regressions; no auto-mashing, move or physics changes.

Preserves active menu-authored neutral-A holds in the existing mapped controller result using ordinary Attack/AttackRaw held bits, scoped to fresh winning sequence ownership. Adds menu-duration-through-jab-and-next-action and filtered-mapper hold/edge regressions. No repeated attack triggers, forced statuses, physics writes, new hooks or logging.

Fixes explicit Custom/new-option previews for fighters with empty file catalogs while Ledge Trap mode is OFF. Shares sequence enablement between menu and runtime, refreshes the bounded opponent roster for any starting preview, and clarifies that queued saves require exiting the match while keeping Smash open. Adds diagnostic empty-Ness/Falcon create/edit/test/save-request coverage; retains deferred SD writes, input-only execution and existing controls.

Allows diagnostic sessions to queue up to 32 recipe saves/renames/deletions, coalescing newer snapshots of the same recipe. Processes completion on the existing outside-battle draw path so all queued jobs drain sequentially, with one save job at a time, unchanged deferred SD writes and normal-silent one-slot behavior. Compares saved recipe snapshots independently of other edits, and fixes deletion of a Custom recipe saved earlier in the same session. Adds bounded-queue, rename/delete preservation and controller CRUD regressions. No gameplay/physics changes, new hooks or online logging.


Ledge-first direct menu navigation; shared silent/diagnostic bounded recipe
management and deferred sequential saves; numbered expandable action editor and
fresh-observation conditional steps, retaining literal button-hold timing.

Allow first in-memory ledge recipes for startup-empty fighters; missing response
categories remain no-op without disabling configured categories.

Fighter-scoped FTP sequence transfers with direction/name selection, merged-file
validation, preserved other fighters, backups and verified failure recovery.

Editable repeated-tap sequence actions with hold/release interval, stick/buttons
and total-frame budget; down-tilt preset and literal frame-clock execution.

Per-button While held activation loops configured recipes on their native clock
and cancels on release; saved activation and down-tilt spam menu configuration.

Simplify repeated-tap menu to A/B/tilt selection, between-tap delay and duration;
retain independent Run once / Loop while held activation on every button recipe.

Editor-only grouped action picker, step insert/delete/duplicate/reorder, direct
step navigation, bounded one-edit Undo and clearer expanded step settings;
cached presentation and unchanged gameplay execution/save timing.

Current-fighter recipe template copying across ledge and button categories,
including unsaved timings; preserve source/name/activation, Undo and lazy chooser.

Skip hidden-menu ImGui context/IO access and unnecessary master-gesture HID reads
during locked matches, retaining the existing 4Hz unlock probe and gameplay clocks.

Restrict recipe editor entry to Training Mode in both builds; retain online compact
selection, mode toggles and saved gameplay recipes without new hooks or logging.

Use a cached plain-text two-page match selector (Minus ledge choices, R3 buttons/
assists); retain Training editor and add Save as startup default. Discard transient
fighter menu/editor data at confirmed match end and reload saved defaults without
combat SD reads or repeated leaked static publication. Training saves now start
one temporary worker immediately with verified backups/recovery, no pending queue.

Prepare auto-tech shield release through existing native eligibility gates before
contact prediction, preserving release across forecast gaps without extra rays or
early presses. Add a parser-verified complete editor action cheat sheet with a
standalone searchable/printable styled table and menu/file examples.

Add a separate, opt-in Vanilla/no-overclock Deluxe test configuration for GPU
crash isolation; normal Kirby packaging does not install or select this preset.

Reuse the Training scene observation outside the shared menu/state lock and
cancel stale deferred menu cleanup when a new battle is positively observed.

Remove save-result application and profile/editor destruction from the graphics
callback; use bounded one-shot mapper maintenance. Keep first-entry startup menu
references until a successful save changes the catalog, avoiding redundant rebuilds.

Add opt-in per-fighter roll reaction recipe tags, Training condition/priority
editing and feedback; resolve at most eight responses on revisions and reuse
the input timeline, bounded roster observations and existing ownership/safety.
Persist conditions with recipes and leave renderer/save-worker architecture intact.

Add a styled searchable/printable reaction-rule cheat sheet covering all current
settings, trigger/state/side choices, file positions, examples and feedback.

Add persisted Menu or X/Y/D-pad toggle activation groups to reaction recipes;
use existing controller edges with release/chord/navigation protection, preserve
manual recipes, and keep automatic helpers outside binding choices.

Add a Training-only fighter settings page with persisted per-fighter walking
input caps, grab estimates, ledge acquisition/follow ranges and existing spacing
switches. Reuse the explicit-save worker, backups and verification; resolve
numeric overrides only on menu/profile changes and preserve default behavior
for profiles without overrides. No native move or physics parameters are changed.

Add a local sequence-validator CLI and optional upload --file selection; report
fighter settings counts alongside recipe validation and retain pre-upload checks.

Fix two stale documentation section links that prevented strict MkDocs serving.

Use fighter stand_distance to release manual ledge-assist walking toward the
already-tracked cliff, with cached motion look-ahead and preserved retreat/Y input.
Keep sequence input priority and unknown/other-height ledges unchanged; add no
geometry searches, native parameter writes or extra ledge activation path.

Isolate fighter-settings saves from recipe catalog replacement, drop validation
snapshots before file commit, retain verified backup/recovery and require an
unchorded Y press on that page. Restore cached Training edit/save/rename control
hints without adding them to lightweight gameplay selectors.

Add explicit saved-ledge/away movement directions and flat facing-conditioned
recipe blocks using sequence-start facing. Keep legacy direction fallbacks,
validate block structure, reject anchorless on-stage rules and show conditional
rather than misleading absolute timing in the Training editor. No new hooks,
move/physics changes or per-frame fighter scans.

Expand editor cheat sheets with all movement direction choices and examples,
link reaction references to the ledge guidance and retain legacy documentation
anchors so strict docs serving accepts older deep links.

Allow ordinary-grab spot-dodge requests from stationary shield animations while
retaining native escape readiness, grounded/hitstop restrictions and attacker-clock
retry timing. Keep shieldstun and invalid clocks rejected; add no scans, native
animation changes, forced transitions or airborne shield requests.

Skip recipe/property rewrites when actions and names are unchanged, preserve
source formatting and prior backups, avoid live catalog publication on no-op
saves and report Already saved accurately. Keep full validation and normal
write/rename/delete/default behavior for actual edits.

Print the requested deferred Training-to-online GPU investigation reminder after
build-helper completion, without changing Switch configurations or plugins.

