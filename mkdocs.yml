site_name: Kirby Assist
site_description: Setup, controls, development, and release documentation for Kirby Assist.
docs_dir: docs
site_dir: site
strict: true

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Installation and configuration: INTEGRATION.md
  - Controls:
      - Analog mash: ANALOG_MASH.md
      - Turbo crouch: TURBO_CONTROLS.md
      - L3 ledge trap: LEDGE_TRAP.md
      - D-pad Down ledge trump: LEDGE_TRUMP.md
  - Development:
      - Rust beginner guide: README_BEGINNER.md
      - Builds and releases: BUILD_VARIANTS.md
      - TODO and task template: TODO.md
      - Maintaining the docs: MAINTAINING.md

plugins:
  - search

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
