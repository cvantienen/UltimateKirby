site_name: Kirby Assist
site_description: Setup, controls, development, and release documentation for Kirby Assist.
docs_dir: docs
site_dir: site
strict: true

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Installation and configuration: INTEGRATION.md
  - Fighters: FIGHTERS.md
  - Controls:
      - Control reference: CONTROLS.md
      - Saved ledge menu: LEDGE_MENU.md
      - Fighter settings explained: FIGHTER_SETTINGS.md
      - Sequence text syntax cheat sheet: SEQUENCE_SYNTAX_CHEATSHEET.md
      - Editor action cheat sheet: EDITOR_ACTION_CHEATSHEET.md
      - Ledge autopilot: LEDGE_TRAP.md
      - Onstage Roll read: ROLL_READ.md
      - Configurable reaction rules: REACTION_RULES.md
      - Reaction-rule cheat sheet: REACTION_RULE_CHEATSHEET.md
      - Shield pressure: SHIELD_PRESSURE.md
      - Out of shield: OUT_OF_SHIELD.md
      - Grab dodge: GRAB_DODGE.md
      - Spot punish: SPOT_PUNISH.md
      - Retired native Y finisher: FINISHERS.md
      - Analog mash: ANALOG_MASH.md
      - Automatic tech: AUTO_TECH.md
      - Trip follow-up: TRIP_AND_SDI.md
      - DI and SDI: DI_SDI.md
      - Jab-lock chase: JAB_LOCK.md
      - Shortcuts: TURBO_CONTROLS.md
      - Input recipes and posture: INPUT_RECIPES.md
      - Training and monitoring: TRAINING_MONITOR.md
      - Retired D-pad slide bindings: SLIDE_CONTROLS.md
      - Vulnerable ledge and regrabs: TWO_FRAME.md
      - Ledge trump: LEDGE_TRUMP.md
  - Development:
      - Source map: CODE_MAP.md
      - Startup sequence files: SEQUENCE_FILES.md
      - Shared observations and timing: OBSERVATIONS_AND_TIMING.md
      - Action ownership: ACTION_OWNERSHIP.md
      - Parked whiff prototype: WHIFF_PUNISH.md
      - Fighter data: FIGHTER_DATA.md
      - Diagnostic result card: CALIBRATION_CARD.md
      - Ledge menu source review: COMBO_REVIEW.md
      - Removed combo system: CUSTOM_COMBOS.md
      - Rust beginner guide: README_BEGINNER.md
      - Runtime reliability: RUST_RELIABILITY_REVIEW.md
      - Training Modpack source review: TRAINING_REFERENCE_REVIEW.md
      - Builds and releases: BUILD_VARIANTS.md
      - Interactive workbench: WORKBENCH.md
      - TODO and task template: TODO.md
      - Maintaining the docs: MAINTAINING.md

# Keep fighter guides searchable and linked from the overview, without adding
# every profile to the sidebar. New guide pages should also be linked there.
not_in_nav: |
  /fighters/**
  /FIGHTER_CONFIGS.md
  /FIGHTER_EXECUTION.md
  /STARTING_CAST.md
  /FIGHTER_ADDITIONS.md
  /SAMUS_LEDGE.md
  /SONIC_LEDGE.md
  /NON_DLC_ROSTER.md
  /KROOL_ISABELLE_LEDGE.md
  /PACMAN_MAC_LEDGE.md
  /KIRBY_YOSHI_LEDGE.md
  /KIRBY_FAIR_CONFIRM.md

plugins:
  - search

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
